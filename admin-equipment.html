<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f43f5e">
<meta name="description" content="Admin Equipment Management — add, edit, verify, and manage DiplomaHub lab equipment.">
<meta name="robots" content="noindex, nofollow">

<meta property="og:type" content="website">
<meta property="og:title" content="Admin — Equipment — DiplomaHub">
<meta property="og:description" content="Manage DiplomaHub equipment.">
<meta property="og:url" content="https://alam-7.github.io/diploma-hub/admin-equipment.html">

<link rel="canonical" href="https://alam-7.github.io/diploma-hub/admin-equipment.html">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="assets/images/icon-192.png">

<title>Admin — Equipment — DiplomaHub</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

<style>
    /* ================= ADMIN THEME ================= */
    :root {
        --admin-primary: #f43f5e;
        --admin-primary-dark: #e11d48;
        --admin-glow: rgba(244, 63, 94, 0.15);
    }

    body { padding-top: 0; background: #0a0a1a; }

    /* ================= NAV ================= */
    .admin-nav {
        position: fixed;
        top: 0; left: 0; right: 0;
        height: var(--nav-height);
        background: rgba(10, 10, 26, 0.95);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(244, 63, 94, 0.15);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 var(--space-lg);
        z-index: 1000;
        gap: 16px;
    }
    .admin-nav .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        color: var(--text);
        font-weight: 700;
        font-size: 1.1rem;
    }
    .admin-nav .brand i.shield { color: var(--admin-primary); font-size: 1.3rem; }
    .admin-nav .brand .badge {
        background: var(--admin-glow);
        color: var(--admin-primary);
        font-size: 0.6rem;
        font-weight: 800;
        padding: 2px 8px;
        border-radius: 6px;
        text-transform: uppercase;
        letter-spacing: 0.8px;
    }
    .admin-nav .nav-links-admin {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
    }
    .admin-nav .nav-links-admin a {
        color: var(--text-muted);
        font-size: 0.85rem;
        padding: 8px 14px;
        border-radius: var(--radius-pill);
        text-decoration: none;
        transition: var(--transition);
        display: inline-flex;
        align-items: center;
        gap: 6px;
    }
    .admin-nav .nav-links-admin a:hover,
    .admin-nav .nav-links-admin a.active {
        color: var(--admin-primary);
        background: var(--admin-glow);
    }
    .admin-nav .user-menu { display: flex; align-items: center; gap: 10px; }
    .admin-nav .user-avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--admin-primary), #f97316);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 0.85rem;
    }
    .admin-nav .logout-btn {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text-muted);
        padding: 7px 14px;
        border-radius: var(--radius-pill);
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition);
        display: inline-flex;
        align-items: center;
        gap: 6px;
    }
    .admin-nav .logout-btn:hover {
        border-color: var(--admin-primary);
        color: var(--admin-primary);
        background: var(--admin-glow);
    }

    /* ================= LAYOUT ================= */
    .admin-container {
        max-width: 1400px;
        margin: 0 auto;
        padding: calc(var(--nav-height) + 20px) var(--space-md) var(--space-xl);
    }

    .page-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: var(--space-lg);
    }
    .page-head h1 { font-size: 1.6rem; display: flex; align-items: center; gap: 10px; }
    .page-head h1 i { color: var(--admin-primary); }
    .page-head .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .page-head button, .page-head a {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 9px 16px;
        border-radius: var(--radius-pill);
        font-size: 0.85rem;
        font-weight: 600;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text-muted);
        cursor: pointer;
        transition: var(--transition);
        text-decoration: none;
    }
    .page-head button:hover, .page-head a:hover {
        border-color: var(--admin-primary);
        color: var(--admin-primary);
        background: var(--admin-glow);
    }
    .page-head .primary {
        background: var(--admin-primary);
        color: #fff;
        border-color: transparent;
    }
    .page-head .primary:hover {
        background: var(--admin-primary-dark);
        color: #fff;
        transform: translateY(-2px);
    }

    /* ================= STATS ================= */
    .admin-stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: var(--space-md);
        margin-bottom: var(--space-lg);
    }
    .admin-stat {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: var(--space-md);
        display: flex;
        align-items: center;
        gap: 12px;
        transition: var(--transition);
    }
    .admin-stat:hover {
        border-color: var(--admin-primary);
        transform: translateY(-2px);
    }
    .admin-stat .icon {
        width: 42px;
        height: 42px;
        min-width: 42px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.1rem;
        background: var(--admin-glow);
        color: var(--admin-primary);
    }
    .admin-stat .icon.green { background: rgba(34,197,94,0.15); color: #22c55e; }
    .admin-stat .icon.amber { background: rgba(245,158,11,0.15); color: #f59e0b; }
    .admin-stat .icon.blue { background: rgba(0,212,255,0.15); color: #00d4ff; }
    .admin-stat .icon.purple { background: rgba(168,85,247,0.15); color: #a855f7; }
    .admin-stat .num { font-size: 1.4rem; font-weight: 800; line-height: 1; }
    .admin-stat .label { font-size: 0.75rem; color: var(--text-muted); margin-top: 3px; }

    /* ================= FILTER ================= */
    .filter-bar {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: var(--space-md);
        padding: var(--space-md);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
    }
    .filter-bar .search-wrap {
        flex: 1;
        min-width: 220px;
        position: relative;
    }
    .filter-bar .search-wrap i {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        pointer-events: none;
    }
    .filter-bar input { padding-left: 44px; }
    .filter-bar select { max-width: 170px; }

    /* ================= BULK BAR ================= */
    .bulk-bar {
        display: none;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        background: var(--admin-glow);
        border: 1px solid var(--admin-primary);
        border-radius: var(--radius-md);
        margin-bottom: var(--space-md);
        font-size: 0.85rem;
        flex-wrap: wrap;
    }
    .bulk-bar.show { display: flex; }
    .bulk-bar .bulk-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .bulk-bar button {
        padding: 7px 14px;
        border-radius: var(--radius-pill);
        font-size: 0.78rem;
        font-weight: 600;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
        transition: var(--transition);
        display: inline-flex;
        align-items: center;
        gap: 5px;
    }
    .bulk-bar button:hover { border-color: var(--admin-primary); color: var(--admin-primary); }
    .bulk-bar button.danger { color: var(--error); border-color: rgba(239,68,68,0.3); }
    .bulk-bar button.danger:hover { background: rgba(239,68,68,0.1); border-color: var(--error); }

    /* ================= TABLE ================= */
    .table-wrap {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        overflow: hidden;
    }
    .table-scroll { overflow-x: auto; }
    table.eq-table {
        width: 100%;
        border-collapse: collapse;
        min-width: 900px;
    }
    table.eq-table th {
        background: rgba(0,0,0,0.3);
        padding: 14px 16px;
        text-align: left;
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.7px;
        color: var(--text-muted);
        white-space: nowrap;
    }
    table.eq-table td {
        padding: 14px 16px;
        border-bottom: 1px solid var(--border);
        font-size: 0.88rem;
        vertical-align: middle;
    }
    table.eq-table tbody tr { transition: var(--transition); }
    table.eq-table tbody tr:hover { background: rgba(244,63,94,0.04); }
    table.eq-table tbody tr:last-child td { border-bottom: none; }

    .eq-info {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
    }
    .eq-thumb {
        width: 44px;
        height: 44px;
        min-width: 44px;
        border-radius: 10px;
        background: var(--admin-glow);
        color: var(--admin-primary);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.3rem;
        overflow: hidden;
        flex-shrink: 0;
    }
    .eq-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .eq-body { min-width: 0; }
    .eq-name {
        font-weight: 600;
        color: var(--text);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 220px;
    }
    .eq-slug {
        font-size: 0.75rem;
        color: var(--text-muted);
        font-family: var(--font-mono);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 220px;
    }

    .category-badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 3px 10px;
        border-radius: var(--radius-pill);
        font-size: 0.7rem;
        font-weight: 700;
        background: var(--admin-glow);
        color: var(--admin-primary);
        text-transform: uppercase;
        letter-spacing: 0.3px;
    }

    .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 3px 10px;
        border-radius: var(--radius-pill);
        font-size: 0.7rem;
        font-weight: 700;
    }
    .status-badge.verified { background: rgba(34,197,94,0.15); color: #22c55e; }
    .status-badge.pending { background: rgba(245,158,11,0.15); color: #f59e0b; }
    .status-badge.featured { background: rgba(168,85,247,0.15); color: #a855f7; }

    .actions-cell {
        display: flex;
        gap: 4px;
        flex-wrap: nowrap;
    }
    .icon-btn {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text-muted);
        width: 30px;
        height: 30px;
        border-radius: 8px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 0.78rem;
        transition: var(--transition);
        flex-shrink: 0;
    }
    .icon-btn:hover {
        border-color: var(--admin-primary);
        color: var(--admin-primary);
        background: var(--admin-glow);
    }
    .icon-btn.danger:hover {
        border-color: var(--error);
        color: var(--error);
        background: rgba(239,68,68,0.1);
    }
    .icon-btn.success:hover {
        border-color: var(--success);
        color: var(--success);
        background: rgba(34,197,94,0.1);
    }

    .checkbox-cell { width: 40px; text-align: center; }
    .checkbox-cell input[type="checkbox"] {
        appearance: none;
        -webkit-appearance: none;
        width: 18px;
        height: 18px;
        border: 2px solid var(--border);
        border-radius: 5px;
        cursor: pointer;
        position: relative;
        transition: var(--transition);
        background: var(--bg-alt);
        padding: 0;
    }
    .checkbox-cell input[type="checkbox"]:checked {
        background: var(--admin-primary);
        border-color: var(--admin-primary);
    }
    .checkbox-cell input[type="checkbox"]:checked::after {
        content: '✓';
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #fff;
        font-weight: 700;
        font-size: 0.72rem;
    }

    /* ================= PAGINATION ================= */
    .pagination {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        background: var(--bg-alt);
        border-top: 1px solid var(--border);
        flex-wrap: wrap;
    }
    .pagination .pg-info { font-size: 0.82rem; color: var(--text-muted); }
    .pagination .pg-controls { display: flex; gap: 4px; flex-wrap: wrap; }
    .pagination button {
        min-width: 34px;
        height: 34px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text-muted);
        font-size: 0.82rem;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition);
        display: inline-flex;
        align-items: center;
        justify-content: center;
    }
    .pagination button:hover:not(:disabled) {
        border-color: var(--admin-primary);
        color: var(--admin-primary);
    }
    .pagination button.active {
        background: var(--admin-primary);
        border-color: var(--admin-primary);
        color: #fff;
    }
    .pagination button:disabled { opacity: 0.35; cursor: not-allowed; }

    /* ================= EMPTY ================= */
    .empty-row { text-align: center; padding: 60px 20px; color: var(--text-muted); }
    .empty-row i { font-size: 2.5rem; color: var(--text-dim); display: block; margin-bottom: 10px; }

    /* ================= MODAL ================= */
    .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.85);
        backdrop-filter: blur(6px);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 2000;
        padding: 20px;
    }
    .modal-overlay.show { display: flex; }
    .modal-content {
        background: var(--bg-alt);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        max-width: 640px;
        width: 100%;
        max-height: 90vh;
        overflow-y: auto;
        padding: var(--space-xl);
        box-shadow: var(--shadow-lg);
    }
    .modal-content h3 {
        font-size: 1.15rem;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .modal-content h3 i { color: var(--admin-primary); }
    .modal-content > p {
        color: var(--text-muted);
        font-size: 0.9rem;
        line-height: 1.6;
        margin-bottom: var(--space-lg);
    }
    .modal-actions {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        margin-top: var(--space-lg);
        flex-wrap: wrap;
    }
    .modal-actions button {
        padding: 11px 22px;
        border-radius: var(--radius-pill);
        font-size: 0.9rem;
        font-weight: 600;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
        transition: var(--transition);
    }
    .modal-actions button:hover {
        border-color: var(--admin-primary);
        color: var(--admin-primary);
    }
    .modal-actions button.danger {
        background: var(--error);
        color: #fff;
        border-color: transparent;
    }
    .modal-actions button.danger:hover { background: #dc2626; color: #fff; }
    .modal-actions button.primary {
        background: var(--admin-primary);
        color: #fff;
        border-color: transparent;
    }
    .modal-actions button.primary:hover {
        background: var(--admin-primary-dark);
        color: #fff;
    }

    /* ================= FORM FIELDS ================= */
    .m-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--space-md);
    }
    .m-grid .full { grid-column: 1 / -1; }
    .m-field { display: flex; flex-direction: column; gap: 6px; }
    .m-field label {
        font-size: 0.82rem;
        font-weight: 600;
        color: var(--text);
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .m-field label i { color: var(--admin-primary); font-size: 0.8rem; }
    .m-field label .req { color: var(--error); margin-left: 2px; }
    .m-field input,
    .m-field select,
    .m-field textarea {
        width: 100%;
        font-size: 0.88rem;
        padding: 10px 12px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        color: var(--text);
        font-family: inherit;
        transition: var(--transition);
    }
    .m-field textarea { resize: vertical; min-height: 70px; line-height: 1.5; }
    .m-field input:focus,
    .m-field select:focus,
    .m-field textarea:focus {
        outline: none;
        border-color: var(--admin-primary);
        box-shadow: 0 0 0 3px var(--admin-glow);
    }
    .m-field input.invalid,
    .m-field select.invalid,
    .m-field textarea.invalid {
        border-color: var(--error);
    }
    .m-field .hint { font-size: 0.72rem; color: var(--text-dim); }

    /* ================= LOADING ================= */
    .loading-screen { text-align: center; padding: var(--space-2xl); }
    .loading-screen .spinner {
        width: 50px;
        height: 50px;
        border: 4px solid var(--surface);
        border-top-color: var(--admin-primary);
        border-radius: 50%;
        margin: 0 auto var(--space-md);
        animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Toast */
    .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%) translateY(100px);
        background: var(--bg-alt);
        border: 1px solid var(--admin-primary);
        color: var(--text);
        padding: 12px 24px;
        border-radius: var(--radius-pill);
        font-size: 0.88rem;
        font-weight: 600;
        box-shadow: var(--shadow-lg);
        z-index: 3000;
        opacity: 0;
        transition: all 0.3s ease;
    }
    .toast.show {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
    }
    .toast i { color: var(--admin-primary); margin-right: 6px; }

    @media (max-width: 900px) {
        .admin-nav { padding: 0 12px; }
        .admin-nav .nav-links-admin a span.nav-text { display: none; }
        .admin-nav .brand span.full-name { display: none; }
    }
    @media (max-width: 600px) {
        .admin-container { padding-left: 12px; padding-right: 12px; }
        .page-head h1 { font-size: 1.25rem; }
        .page-head .actions { width: 100%; }
        .page-head .actions > * { flex: 1; justify-content: center; }
        .filter-bar select { max-width: 100%; }
        .m-grid { grid-template-columns: 1fr; }
        table.eq-table th, table.eq-table td { padding: 10px 12px; font-size: 0.82rem; }
    }
</style>
</head>
<body>

<!-- ================= ADMIN NAV ================= -->
<nav class="admin-nav">
    <a href="admin-users.html" class="brand">
        <i class="fas fa-shield-alt shield"></i>
        <span class="full-name">DIPLOMA HUB</span>
        <span class="badge">Admin</span>
    </a>
    <div class="nav-links-admin">
        <a href="admin-users.html"><i class="fas fa-users"></i> <span class="nav-text">Users</span></a>
        <a href="admin-equipment.html" class="active"><i class="fas fa-tools"></i> <span class="nav-text">Equipment</span></a>
        <a href="admin-verify.html"><i class="fas fa-check-circle"></i> <span class="nav-text">Verify</span></a>
        <a href="dashboard.html"><i class="fas fa-user"></i> <span class="nav-text">Site</span></a>
    </div>
    <div class="user-menu">
        <div class="user-avatar" id="adminAvatar">A</div>
        <button class="logout-btn" onclick="handleLogout()">
            <i class="fas fa-sign-out-alt"></i> Logout
        </button>
    </div>
</nav>

<!-- ================= MAIN ================= -->
<div class="admin-container">

    <div id="loading" class="loading-screen">
        <div class="spinner"></div>
        <p class="text-muted">Loading equipment…</p>
    </div>

    <div id="content" style="display:none;">

        <div class="page-head">
            <h1><i class="fas fa-tools"></i> Equipment Management</h1>
            <div class="actions">
                <button onclick="openAddEquipment()" class="primary">
                    <i class="fas fa-plus"></i> Add Equipment
                </button>
                <button onclick="exportCSV()">
                    <i class="fas fa-download"></i> Export CSV
                </button>
                <label style="cursor:pointer;">
                    <input type="file" id="csvFile" accept=".csv" style="display:none;" onchange="importCSV(event)">
                    <span style="display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:var(--radius-pill);font-size:0.85rem;font-weight:600;border:1px solid var(--border);color:var(--text-muted);cursor:pointer;transition:var(--transition);">
                        <i class="fas fa-upload"></i> Import CSV
                    </span>
                </label>
                <button onclick="refreshEquipment()">
                    <i class="fas fa-sync"></i> Refresh
                </button>
            </div>
        </div>

        <div class="admin-stats" id="statsGrid"></div>

        <div class="filter-bar">

<!-- ================= SCRIPTS ================= -->
<script>
// ============================================================
// CONFIG
// ============================================================
const ADMIN_SESSION_KEY = 'dh_admin_session';
const MOCK_EQUIPMENT_KEY = 'dh_mock_equipment';
const PAGE_SIZE = 10;

// ============================================================
// STATE
// ============================================================
let allEquipment = [];
let filteredEquipment = [];
let selectedIds = new Set();
let currentPage = 1;
let editingId = null;
let currentAdmin = null;

// ============================================================
// HELPERS
// ============================================================
function escapeHtml(str) {
    if (str == null) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}
function showToast(msg) {
    const t = document.getElementById('toast');
    document.getElementById('toastMsg').textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
}
function getAdminSession() {
    try {
        const s = localStorage.getItem(ADMIN_SESSION_KEY) || sessionStorage.getItem(ADMIN_SESSION_KEY);
        if (!s) return null;
        const p = JSON.parse(s);
        if (p.expiresAt && p.expiresAt < Date.now()) return null;
        if (p.role !== 'admin' && p.role !== 'moderator') return null;
        return p;
    } catch (e) { return null; }
}
function getInitials(name, email) {
    const src = (name || email || 'A').trim();
    const parts = src.split(/\s+/);
    if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
    return src.substring(0, 2).toUpperCase();
}
function formatDate(ts) {
    if (!ts) return '—';
    return new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}
function slugify(str) {
    return str.toLowerCase().trim().replace(/\s+/g, '-').replace(/[^\w-]/g, '');
}

// ============================================================
// LOAD
// ============================================================
async function loadEquipment() {
    document.getElementById('loading').style.display = 'block';
    document.getElementById('content').style.display = 'none';

    try {
        if (window.supabaseClient && typeof window.supabaseClient.from === 'function') {
            const { data, error } = await window.supabaseClient
                .from('equipment')
                .select('*')
                .order('updated_at', { ascending: false });
            if (error) throw new Error(error.message);
            allEquipment = (data || []).map(e => ({
                id: e.id,
                name: e.name,
                slug: e.slug,
                category: e.category || '',
                icon: e.icon || '🔧',
                image: e.image || '',
                purpose: e.purpose || '',
                principle: e.principle || '',
                parts: e.parts || [],
                applications: e.applications || [],
                safety: e.safety || [],
                status: e.status || 'pending',
                createdAt: e.created_at ? new Date(e.created_at).getTime() : Date.now(),
                updatedAt: e.updated_at ? new Date(e.updated_at).getTime() : Date.now()
            }));
        } else {
            await new Promise(r => setTimeout(r, 500));
            allEquipment = loadMockEquipment();
        }

        updateStats();
        populateCategories();
        applyFilters();

        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';

    } catch (err) {
        console.error('Load equipment error:', err);
        showToast('Failed to load equipment');
        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';
    }
}

function loadMockEquipment() {
    try {
        const stored = JSON.parse(localStorage.getItem(MOCK_EQUIPMENT_KEY));
        if (stored && stored.length) return stored;
    } catch (e) {}

    const demo = [
        { id: 'e1', name: 'Digital Multimeter', slug: 'digital-multimeter', category: 'Measurement', icon: '🔌', status: 'verified', updatedAt: Date.now() - 86400000, createdAt: Date.now() - 86400000, purpose: 'Measures voltage, current, resistance.', principle: 'Uses ADC.', parts: ['Display', 'Probes'], applications: ['Testing'], safety: ['Do not exceed rated voltage'] },
        { id: 'e2', name: 'Cathode Ray Oscilloscope', slug: 'cro', category: 'Measurement', icon: '📺', status: 'verified', updatedAt: Date.now() - 172800000, createdAt: Date.now() - 172800000, purpose: 'Displays waveforms.', principle: 'Electron beam.', parts: ['CRT', 'Graticule'], applications: ['Signal analysis'], safety: ['High voltage'] },
        { id: 'e3', name: 'Function Generator', slug: 'function-generator', category: 'Signal Source', icon: '〰️', status: 'verified', updatedAt: Date.now() - 259200000, createdAt: Date.now() - 259200000, purpose: 'Generates waveforms.', principle: 'Oscillator.', parts: ['Frequency dial'], applications: ['Testing'], safety: ['Check output'] },
        { id: 'e4', name: 'DC Power Supply', slug: 'dc-power-supply', category: 'Power Source', icon: '⚡', status: 'pending', updatedAt: Date.now() - 345600000, createdAt: Date.now() - 345600000, purpose: 'Provides DC voltage.', principle: 'Rectifier.', parts: ['Transformer'], applications: ['Circuit power'], safety: ['Polarity'] },
        { id: 'e5', name: 'Breadboard', slug: 'breadboard', category: 'Prototyping', icon: '🧩', status: 'verified', updatedAt: Date.now() - 432000000, createdAt: Date.now() - 432000000, purpose: 'Solderless prototyping.', principle: 'Spring clips.', parts: ['Terminal strips'], applications: ['Circuit building'], safety: ['Check connections'] },
        { id: 'e6', name: 'Soldering Iron', slug: 'soldering-iron', category: 'Tools', icon: '🔥', status: 'featured', updatedAt: Date.now() - 518400000, createdAt: Date.now() - 518400000, purpose: 'Joins components.', principle: 'Heat melts solder.', parts: ['Tip', 'Handle'], applications: ['PCB assembly'], safety: ['Do not touch tip'] },
        { id: 'e7', name: 'Vernier Caliper', slug: 'vernier-caliper', category: 'Measurement', icon: '📏', status: 'verified', updatedAt: Date.now() - 604800000, createdAt: Date.now() - 604800000, purpose: 'Precise measurement.', principle: 'Vernier scale.', parts: ['Main scale'], applications: ['Dimensions'], safety: ['Handle gently'] },
        { id: 'e8', name: 'Micrometer Screw Gauge', slug: 'micrometer', category: 'Measurement', icon: '🔩', status: 'verified', updatedAt: Date.now() - 691200000, createdAt: Date.now() - 691200000, purpose: 'Precise thickness.', principle: 'Screw scale.', parts: ['Spindle'], applications: ['Wire diameter'], safety: ['Do not overtighten'] },
        { id: 'e9', name: 'Digital Storage Oscilloscope', slug: 'dso', category: 'Measurement', icon: '🖥️', status: 'pending', updatedAt: Date.now() - 777600000, createdAt: Date.now() - 777600000, purpose: 'Stores waveforms.', principle: 'Digital sampling.', parts: ['ADC'], applications: ['Analysis'], safety: ['Grounding'] },
        { id: 'e10', name: 'Autotransformer', slug: 'variac', category: 'Power Source', icon: '🔋', status: 'verified', updatedAt: Date.now() - 864000000, createdAt: Date.now() - 864000000, purpose: 'Variable AC.', principle: 'Transformer.', parts: ['Dial'], applications: ['Testing'], safety: ['Insulate'] },
        { id: 'e11', name: 'Logic Probe', slug: 'logic-probe', category: 'Digital', icon: '🔦', status: 'verified', updatedAt: Date.now() - 950400000, createdAt: Date.now() - 950400000, purpose: 'Tests logic levels.', principle: 'Comparator.', parts: ['LED'], applications: ['Debug'], safety: ['Correct voltage'] },
        { id: 'e12', name: 'IC Tester', slug: 'ic-tester', category: 'Digital', icon: '🧠', status: 'pending', updatedAt: Date.now() - 1036800000, createdAt: Date.now() - 1036800000, purpose: 'Tests ICs.', principle: 'Pattern compare.', parts: ['ZIF socket'], applications: ['IC check'], safety: ['Correct orientation'] }
    ];
    localStorage.setItem(MOCK_EQUIPMENT_KEY, JSON.stringify(demo));
    return demo;
}

function saveMockEquipment() {
    if (!window.supabaseClient) {
        localStorage.setItem(MOCK_EQUIPMENT_KEY, JSON.stringify(allEquipment));
    }
}

// ============================================================
// STATS
// ============================================================
function updateStats() {
    const total = allEquipment.length;
    const verified = allEquipment.filter(e => e.status === 'verified').length;
    const pending = allEquipment.filter(e => e.status === 'pending').length;
    const featured = allEquipment.filter(e => e.status === 'featured').length;
    const categories = new Set(allEquipment.map(e => e.category).filter(Boolean)).size;

    const stats = [
        { icon: 'fa-tools', cls: '', num: total, label: 'Total Equipment' },
        { icon: 'fa-check-circle', cls: 'green', num: verified, label: 'Verified' },
        { icon: 'fa-clock', cls: 'amber', num: pending, label: 'Pending' },
        { icon: 'fa-star', cls: 'purple', num: featured, label: 'Featured' },
        { icon: 'fa-folder', cls: 'blue', num: categories, label: 'Categories' }
    ];
    document.getElementById('statsGrid').innerHTML = stats.map(s => `
        <div class="admin-stat">
            <div class="icon ${s.cls}"><i class="fas ${s.icon}"></i></div>
            <div>
                <div class="num">${s.num}</div>
                <div class="label">${s.label}</div>
            </div>
        </div>
    `).join('');
}

function populateCategories() {
    const cats = [...new Set(allEquipment.map(e => e.category).filter(Boolean))].sort();
    const sel = document.getElementById('categoryFilter');
    sel.innerHTML = '<option value="all">All Categories</option>' +
        cats.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');

    const dl = document.getElementById('catList');
    dl.innerHTML = cats.map(c => `<option value="${escapeHtml(c)}">`).join('');
}

// ============================================================
// FILTER
// ============================================================
function applyFilters() {
    const q = document.getElementById('searchInput').value.toLowerCase().trim();
    const category = document.getElementById('categoryFilter').value;
    const status = document.getElementById('statusFilter').value;
    const sort = document.getElementById('sortSelect').value;

    filteredEquipment = allEquipment.filter(e => {
        const matchQ = !q ||
            (e.name || '').toLowerCase().includes(q) ||
            (e.category || '').toLowerCase().includes(q) ||
            (e.slug || '').toLowerCase().includes(q);
        const matchC = category === 'all' || e.category === category;
        const matchS = status === 'all' || e.status === status;
        return matchQ && matchC && matchS;
    });

    if (sort === 'newest') filteredEquipment.sort((a, b) => b.updatedAt - a.updatedAt);
    else if (sort === 'oldest') filteredEquipment.sort((a, b) => a.updatedAt - b.updatedAt);
    else if (sort === 'az') filteredEquipment.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
    else if (sort === 'za') filteredEquipment.sort((a, b) => (b.name || '').localeCompare(a.name || ''));

    currentPage = 1;
    renderTable();
    renderPagination();
}

// ============================================================
// RENDER TABLE
// ============================================================
function renderTable() {
    const tbody = document.getElementById('eqTable');
    const start = (currentPage - 1) * PAGE_SIZE;
    const pageItems = filteredEquipment.slice(start, start + PAGE_SIZE);

    if (!pageItems.length) {
        tbody.innerHTML = `
            <tr><td colspan="6">
                <div class="empty-row">
                    <i class="fas fa-tools"></i>
                    <p>No equipment found</p>
                </div>
            </td></tr>`;
        return;
    }

    tbody.innerHTML = pageItems.map(e => {
        const isSelected = selectedIds.has(e.id);

        let statusBadge = '';
        if (e.status === 'verified') statusBadge = '<span class="status-badge verified"><i class="fas fa-check-circle"></i> Verified</span>';
        else if (e.status === 'featured') statusBadge = '<span class="status-badge featured"><i class="fas fa-star"></i> Featured</span>';
        else statusBadge = '<span class="status-badge pending"><i class="fas fa-clock"></i> Pending</span>';

        const thumb = e.image
            ? `<div class="eq-thumb"><img src="${escapeHtml(e.image)}" alt="${escapeHtml(e.name)}" onerror="this.parentNode.innerHTML='${escapeHtml(e.icon || '🔧')}'"></div>`
            : `<div class="eq-thumb">${escapeHtml(e.icon || '🔧')}</div>`;

        return `
            <tr>
                <td class="checkbox-cell">
                    <input type="checkbox" ${isSelected ? 'checked' : ''}
                           onchange="toggleSelect('${e.id}', this.checked)">
                </td>
                <td>
                    <div class="eq-info">
                        ${thumb}
                        <div class="eq-body">
                            <div class="eq-name">${escapeHtml(e.name)}</div>
                            <div class="eq-slug">${escapeHtml(e.slug)}</div>
                        </div>
                    </div>
                </td>
                <td>
                    <span class="category-badge">
                        <i class="fas fa-folder"></i> ${escapeHtml(e.category || '—')}
                    </span>
                </td>
                <td>${statusBadge}</td>
                <td>${formatDate(e.updatedAt)}</td>
                <td>
                    <div class="actions-cell">
                        <button class="icon-btn" onclick="editEquipment('${e.id}')" title="Edit">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="icon-btn success" onclick="quickStatus('${e.id}', '${e.status === 'verified' ? 'pending' : 'verified'}')" title="Toggle verify">
                            <i class="fas fa-${e.status === 'verified' ? 'clock' : 'check'}"></i>
                        </button>
                        <button class="icon-btn danger" onclick="quickDelete('${e.id}')" title="Delete">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </td>
            </tr>
        `;
    }).join('');

    document.getElementById('selectAll').checked =
        pageItems.length > 0 && pageItems.every(e => selectedIds.has(e.id));
}

// ============================================================
// PAGINATION
// ============================================================
function renderPagination() {
    const total = filteredEquipment.length;
    const totalPages = Math.ceil(total / PAGE_SIZE) || 1;
    const start = total === 0 ? 0 : (currentPage - 1) * PAGE_SIZE + 1;
    const end = Math.min(currentPage * PAGE_SIZE, total);

    document.getElementById('pagination').innerHTML = `
        <div class="pg-info">
            Showing <strong>${start}</strong>–<strong>${end}</strong> of <strong>${total}</strong>
        </div>
        <div class="pg-controls">
            <button onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>
                <i class="fas fa-chevron-left"></i>
            </button>
            ${buildPageNumbers(currentPage, totalPages)}
            <button onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>
    `;
}

function buildPageNumbers(current, total) {
    const pages = [];
    for (let i = 1; i <= total; i++) {
        if (i === 1 || i === total || Math.abs(i - current) <= 1) {
            pages.push(`<button class="${i === current ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`);
        } else if (pages[pages.length - 1] !== '<span style="color:var(--text-dim);padding:0 6px;">…</span>') {
            pages.push('<span style="color:var(--text-dim);padding:0 6px;">…</span>');
        }
    }
    return pages.join('');
}

function goToPage(p) {
    const totalPages = Math.ceil(filteredEquipment.length / PAGE_SIZE) || 1;
    if (p < 1 || p > totalPages) return;
    currentPage = p;
    renderTable();
    renderPagination();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ============================================================
// SELECTION
// ============================================================
function toggleSelect(id, checked) {
    if (checked) selectedIds.add(id);
    else selectedIds.delete(id);
    updateBulkBar();
    renderTable();
}
function toggleSelectAll(el) {
    const start = (currentPage - 1) * PAGE_SIZE;
    const pageItems = filteredEquipment.slice(start, start + PAGE_SIZE);
    if (el.checked) pageItems.forEach(e => selectedIds.add(e.id));
    else pageItems.forEach(e => selectedIds.delete(e.id));
    updateBulkBar();
    renderTable();
}
function updateBulkBar() {
    document.getElementById('bulkCount').textContent = selectedIds.size;
    document.getElementById('bulkBar').classList.toggle('show', selectedIds.size > 0);
}
function clearSelection() {
    selectedIds.clear();
    updateBulkBar();
    renderTable();
}

// ============================================================
// ACTIONS
// ============================================================
function quickStatus(id, status) {
    const e = allEquipment.find(x => x.id === id);
    if (!e) return;
    e.status = status;
    e.updatedAt = Date.now();
    saveMockEquipment();
    updateStats();
    applyFilters();
    showToast('Status → ' + status);
}

function quickDelete(id) {
    const e = allEquipment.find(x => x.id === id);
    if (!e) return;
    confirmAction(
        'Delete equipment?',
        `Permanently delete <strong>${escapeHtml(e.name)}</strong>?`,
        () => performAction('delete', [id])
    );
}

function bulkAction(action) {
    const ids = [...selectedIds];
    if (!ids.length) return;

    const labels = {
        verify: `Verify ${ids.length} item(s)?`,
        unverify: `Mark ${ids.length} item(s) as pending?`,
        delete: `Permanently delete ${ids.length} item(s)?`
    };

    if (action === 'delete') {
        confirmAction(labels.delete, 'This cannot be undone.', () => performAction(action, ids));
    } else {
        performAction(action, ids);
    }
}

async function performAction(action, ids) {
    try {
        if (window.supabaseClient && typeof window.supabaseClient.from === 'function') {
            if (action === 'delete') {
                const { error } = await window.supabaseClient.from('equipment').delete().in('id', ids);
                if (error) throw new Error(error.message);
            } else {
                const status = action === 'verify' ? 'verified' : 'pending';
                const { error } = await window.supabaseClient.from('equipment')
                    .update({ status, updated_at: new Date().toISOString() })
                    .in('id', ids);
                if (error) throw new Error(error.message);
            }
        }

        if (action === 'delete') {
            allEquipment = allEquipment.filter(e => !ids.includes(e.id));
            ids.forEach(id => selectedIds.delete(id));
        } else {
            const status = action === 'verify' ? 'verified' : 'pending';
            allEquipment.forEach(e => {
                if (ids.includes(e.id)) {
                    e.status = status;
                    e.updatedAt = Date.now();
                }
            });
        }

        saveMockEquipment();
        updateStats();
        applyFilters();
        updateBulkBar();
        showToast('Action completed');

    } catch (err) {
        console.error(err);
        showToast('Failed: ' + err.message);
    }
}

// ============================================================
// ADD / EDIT
// ============================================================
function openAddEquipment() {
    editingId = null;
    document.getElementById('editTitle').innerHTML = '<i class="fas fa-plus"></i> Add Equipment';
    document.getElementById('editSubtitle').textContent = 'Fill in the details below.';
    clearForm();
    document.getElementById('editModal').classList.add('show');
}

function editEquipment(id) {
    const e = allEquipment.find(x => x.id === id);
    if (!e) return;
    editingId = id;

    document.getElementById('editTitle').innerHTML = '<i class="fas fa-edit"></i> Edit Equipment';
    document.getElementById('editSubtitle').textContent = 'Update the details below.';

    document.getElementById('eName').value = e.name || '';
    document.getElementById('eSlug').value = e.slug || '';
    document.getElementById('eCategory').value = e.category || '';
    document.getElementById('eIcon').value = e.icon || '';
    document.getElementById('eStatus').value = e.status || 'pending';
    document.getElementById('eImage').value = e.image || '';
    document.getElementById('ePurpose').value = e.purpose || '';
    document.getElementById('ePrinciple').value = e.principle || '';
    document.getElementById('eParts').value = (e.parts || []).join('\n');
    document.getElementById('eApplications').value = (e.applications || []).join('\n');
    document.getElementById('eSafety').value = (e.safety || []).join('\n');

    document.getElementById('editModal').classList.add('show');
}

function clearForm() {
    ['eName','eSlug','eCategory','eIcon','eImage','ePurpose','ePrinciple','eParts','eApplications','eSafety']
        .forEach(id => document.getElementById(id).value = '');
    document.getElementById('eStatus').value = 'pending';
}

function saveEquipment() {
    const name = document.getElementById('eName').value.trim();
    const slugInput = document.getElementById('eSlug').value.trim();
    const category = document.getElementById('eCategory').value.trim();

    if (!name) return showToast('Name is required');
    if (!category) return showToast('Category is required');

    const slug = slugInput || slugify(name);

    if (allEquipment.some(e => e.slug === slug && e.id !== editingId)) {
        return showToast('Slug already exists');
    }

    const data = {
        name,
        slug,
        category,
        icon: document.getElementById('eIcon').value.trim() || '🔧',
        status: document.getElementById('eStatus').value,
        image: document.getElementById('eImage').value.trim(),
        purpose: document.getElementById('ePurpose').value.trim(),
        principle: document.getElementById('ePrinciple').value.trim(),
        parts: document.getElementById('eParts').value.split('\n').map(s => s.trim()).filter(Boolean),
        applications: document.getElementById('eApplications').value.split('\n').map(s => s.trim()).filter(Boolean),
        safety: document.getElementById('eSafety').value.split('\n').map(s => s.trim()).filter(Boolean),
        updatedAt: Date.now()
    };

    if (editingId) {
        const idx = allEquipment.findIndex(e => e.id === editingId);
        allEquipment[idx] = { ...allEquipment[idx], ...data };
        showToast('Equipment updated');
    } else {
        allEquipment.unshift({
            id: 'e-' + Date.now(),
            ...data,
            createdAt: Date.now()
        });
        showToast('Equipment added');
    }

    saveMockEquipment();
    updateStats();
    populateCategories();
    applyFilters();
    closeModal('editModal');
}

// ============================================================
// CONFIRM MODAL
// ============================================================
let confirmCallback = null;
function confirmAction(title, msg, cb) {
    document.getElementById('confirmTitle').innerHTML =
        '<i class="fas fa-exclamation-triangle"></i> ' + escapeHtml(title);
    document.getElementById('confirmMsg').innerHTML = msg;
    confirmCallback = cb;
    document.getElementById('confirmBtn').onclick = () => {
        closeModal('confirmModal');
        if (confirmCallback) confirmCallback();
    };
    document.getElementById('confirmModal').classList.add('show');
}
function closeModal(id) {
    document.getElementById(id).classList.remove('show');
}

// ============================================================
// CSV
// ============================================================
function exportCSV() {
    if (!filteredEquipment.length) return showToast('No data to export');

    const headers = ['id','name','slug','category','icon','status','purpose','image'];
    const rows = filteredEquipment.map(e => [
        e.id, e.name, e.slug, e.category, e.icon, e.status, e.purpose || '', e.image || ''
    ]);

    const csv = [headers, ...rows]
        .map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(','))
        .join('\n');

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `diplomahub-equipment-${Date.now()}.csv`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('Exported ' + filteredEquipment.length + ' rows');
}

function importCSV(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = e => {
        try {
            const text = e.target.result;
            const lines = text.split('\n').filter(Boolean);
            if (lines.length < 2) throw new Error('Empty CSV');

            const headers = lines[0].split(',').map(h => h.replace(/"/g,'').trim().toLowerCase());
            const idxName = headers.indexOf('name');
            const idxCat = headers.indexOf('category');
            const idxSlug = headers.indexOf('slug');

            if (idxName === -1 || idxCat === -1) throw new Error('Missing required columns: name, category');

            let imported = 0;
            for (let i = 1; i < lines.length; i++) {
                const cols = lines[i].match(/(".*?"|[^,]+)(?=\s*,|\s*$)/g) || [];
                const clean = cols.map(c => (c || '').replace(/^"|"$/g, '').trim());
                const name = clean[idxName];
                const category = clean[idxCat];
                if (!name || !category) continue;

                const slug = (idxSlug > -1 && clean[idxSlug]) || slugify(name);
                if (allEquipment.some(e => e.slug === slug)) continue;

                allEquipment.unshift({
                    id: 'e-' + Date.now() + '-' + i,
                    name,
                    slug,
                    category,
                    icon: '🔧',
                    status: 'pending',
                    purpose: '',
                    parts: [],
                    applications: [],
                    safety: [],
                    createdAt: Date.now(),
                    updatedAt: Date.now()
                });
                imported++;
            }

            if (imported > 0) {
                saveMockEquipment();
                updateStats();
                populateCategories();
                applyFilters();
                showToast(`Imported ${imported} item(s)`);
            } else {
                showToast('No new items imported');
            }
        } catch (err) {
            console.error(err);
            showToast('Import failed: ' + err.message);
        }
    };
    reader.readAsText(file);
    event.target.value = '';
}
