<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Equipment - Admin</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .admin-page {
            padding: 90px 20px 40px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--glass-border);
        }
        .admin-header h1 { font-size: 2rem; }
        .admin-header .back-btn {
            color: var(--text-secondary);
            text-decoration: none;
            transition: var(--transition);
        }
        .admin-header .back-btn:hover { color: var(--neon-blue); }
        .equipment-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--glass-bg);
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--glass-border);
        }
        .equipment-table th {
            background: var(--darker-bg);
            padding: 15px;
            text-align: left;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .equipment-table td {
            padding: 15px;
            border-bottom: 1px solid var(--glass-border);
            color: var(--text-primary);
        }
        .equipment-table tr:hover td {
            background: rgba(0, 212, 255, 0.02);
        }
        .equipment-table .status-pending {
            color: #f59e0b;
        }
        .equipment-table .status-verified {
            color: #22c55e;
        }
        .equipment-table .status-rejected {
            color: #ef4444;
        }
        .btn-edit {
            background: rgba(0, 212, 255, 0.15);
            color: var(--neon-blue);
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            transition: var(--transition);
            margin-right: 5px;
        }
        .btn-edit:hover {
            background: rgba(0, 212, 255, 0.25);
        }
        .btn-delete {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-delete:hover {
            background: rgba(239, 68, 68, 0.25);
        }
        .btn-add {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-add:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.2);
        }
        .search-box-admin {
            display: flex;
            gap: 10px;
            align-items: center;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            padding: 5px 15px;
            flex: 1;
            max-width: 300px;
        }
        .search-box-admin input {
            background: transparent;
            border: none;
            padding: 10px 0;
            color: var(--text-primary);
            width: 100%;
            outline: none;
        }
        .search-box-admin input::placeholder {
            color: var(--text-secondary);
        }
        .search-box-admin i {
            color: var(--text-secondary);
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: var(--dark-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 40px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal h2 {
            margin-bottom: 20px;
        }
        .modal .form-group {
            margin-bottom: 15px;
        }
        .modal .form-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .modal .form-group input,
        .modal .form-group select,
        .modal .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: var(--transition);
        }
        .modal .form-group input:focus,
        .modal .form-group select:focus,
        .modal .form-group textarea:focus {
            outline: none;
            border-color: var(--neon-blue);
        }
        .modal .form-group textarea {
            min-height: 60px;
            resize: vertical;
        }
        .modal .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: flex-end;
        }
        .modal .btn-close {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            padding: 10px 24px;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
        }
        .modal .btn-close:hover {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
        }
        .modal .btn-save {
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            border: none;
            color: white;
            padding: 10px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
        }
        .modal .btn-save:hover {
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.2);
        }
        .no-data {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
        @media (max-width: 768px) {
            .equipment-table {
                font-size: 0.85rem;
            }
            .equipment-table th,
            .equipment-table td {
                padding: 10px;
            }
            .admin-header {
                flex-direction: column;
                align-items: stretch;
            }
            .search-box-admin {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <i class="fas fa-graduation-cap"></i>
                <span>DIPLOMA<span class="highlight">HUB</span></span>
            </div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="admin-dashboard.html" class="active">Admin</a>
            </div>
            <div class="nav-right">
                <button class="theme-toggle" onclick="toggleTheme()">
                    <i class="fas fa-moon" id="themeIcon"></i>
                </button>
                <button class="sign-out-btn" onclick="signOut()" style="background:rgba(239,68,68,0.15);color:#ef4444;border:1px solid rgba(239,68,68,0.3);padding:10px 20px;border-radius:8px;cursor:pointer;font-weight:500;">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
                <button class="mobile-menu-btn" onclick="toggleMobileMenu()">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </div>
    </nav>

    <div class="admin-page">
        <div class="admin-header">
            <div>
                <a href="admin-dashboard.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
                <h1>🔧 Manage <span class="gradient-text">Equipment</span></h1>
            </div>
            <div style="display: flex; gap: 15px; align-items: center; flex-wrap: wrap;">
                <div class="search-box-admin">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search equipment..." id="searchInput" onkeyup="filterEquipment()">
                </div>
                <button class="btn-add" onclick="openAddModal()">
                    <i class="fas fa-plus"></i> Add Equipment
                </button>
            </div>
        </div>

        <div style="overflow-x: auto;">
            <table class="equipment-table" id="equipmentTable">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Category</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="equipmentBody">
                    <tr><td colspan="4" class="no-data">Loading equipment...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal-overlay" id="equipmentModal">
        <div class="modal">
            <h2 id="modalTitle">Add Equipment</h2>
            <form id="equipmentForm">
                <input type="hidden" id="editId">
                <div class="form-group">
                    <label for="eqName">Equipment Name *</label>
                    <input type="text" id="eqName" placeholder="e.g., Vernier Caliper" required>
                </div>
                <div class="form-group">
                    <label for="eqSlug">Slug (URL-friendly name) *</label>
                    <input type="text" id="eqSlug" placeholder="e.g., vernier-caliper" required>
                </div>
                <div class="form-group">
                    <label for="eqCategory">Category *</label>
                    <select id="eqCategory" required>
                        <option value="">Select Category</option>
                        <option value="Measuring Instruments">Measuring Instruments</option>
                        <option value="Electrical & Electronic">Electrical & Electronic</option>
                        <option value="Mechanical Workshop">Mechanical Workshop</option>
                        <option value="Civil & Surveying">Civil & Surveying</option>
                        <option value="Computer & IT">Computer & IT</option>
                        <option value="Testing & Quality">Testing & Quality</option>
                        <option value="Power Systems">Power Systems</option>
                        <option value="Communication">Communication</option>
                        <option value="Hand Tools">Hand Tools</option>
                        <option value="Common Engineering">Common Engineering</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="eqPurpose">Purpose</label>
                    <textarea id="eqPurpose" placeholder="What does this equipment do?"></textarea>
                </div>
                <div class="form-group">
                    <label for="eqStatus">Verification Status</label>
                    <select id="eqStatus">
                        <option value="pending">Pending</option>
                        <option value="verified">Verified</option>
                        <option value="rejected">Rejected</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-close" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn-save"><i class="fas fa-save"></i> Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        let allEquipment = [];
        let editingId = null;

        document.addEventListener('DOMContentLoaded', async function() {
            if (typeof initSupabase === 'function') {
                initSupabase();
            }

            const user = await getCurrentUser();
            if (!user) {
                window.location.href = 'admin-login.html';
                return;
            }

            const profile = await getProfile(user.id);
            if (!profile || profile.role !== 'admin') {
                alert('❌ Access denied.');
                await signOut();
                window.location.href = 'index.html';
                return;
            }

            await loadEquipment();
        });

        async function loadEquipment() {
            const body = document.getElementById('equipmentBody');
            body.innerHTML = '<tr><td colspan="4" class="no-data">Loading...</td></tr>';

            try {
                const { data, error } = await supabase
                    .from('equipment')
                    .select('*')
                    .order('name');

                if (error) throw error;

                allEquipment = data || [];
                renderEquipment(allEquipment);
            } catch (err) {
                console.error('Error loading equipment:', err);
                body.innerHTML = '<tr><td colspan="4" class="no-data">Error loading equipment</td></tr>';
            }
        }

        function renderEquipment(items) {
            const body = document.getElementById('equipmentBody');
            
            if (!items || items.length === 0) {
                body.innerHTML = '<tr><td colspan="4" class="no-data">No equipment found</td></tr>';
                return;
            }

            body.innerHTML = items.map(e => `
                <tr>
                    <td><strong>${e.name}</strong></td>
                    <td>${e.category || 'Uncategorized'}</td>
                    <td><span class="status-${e.verification_status || 'pending'}">${e.verification_status || 'pending'}</span></td>
                    <td>
                        <button class="btn-edit" onclick="openEditModal('${e.id}')"><i class="fas fa-edit"></i></button>
                        <button class="btn-delete" onclick="deleteEquipment('${e.id}')"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        function filterEquipment() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allEquipment.filter(e => 
                e.name.toLowerCase().includes(query) ||
                (e.category || '').toLowerCase().includes(query)
            );
            renderEquipment(filtered);
        }

        function openAddModal() {
            editingId = null;
            document.getElementById('modalTitle').textContent = 'Add Equipment';
            document.getElementById('editId').value = '';
            document.getElementById('eqName').value = '';
            document.getElementById('eqSlug').value = '';
            document.getElementById('eqCategory').value = '';
            document.getElementById('eqPurpose').value = '';
            document.getElementById('eqStatus').value = 'pending';
            document.getElementById('equipmentModal').classList.add('active');
        }

        async function openEditModal(id) {
            const item = allEquipment.find(e => e.id === id);
            if (!item) return;

            editingId = id;
            document.getElementById('modalTitle').textContent = 'Edit Equipment';
            document.getElementById('editId').value = id;
            document.getElementById('eqName').value = item.name || '';
            document.getElementById('eqSlug').value = item.slug || '';
            document.getElementById('eqCategory').value = item.category || '';
            document.getElementById('eqPurpose').value = item.purpose || '';
            document.getElementById('eqStatus').value = item.verification_status || 'pending';
            document.getElementById('equipmentModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('equipmentModal').classList.remove('active');
        }

        document.getElementById('equipmentForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const data = {
                name: document.getElementById('eqName').value.trim(),
                slug: document.getElementById('eqSlug').value.trim(),
                category: document.getElementById('eqCategory').value,
                purpose: document.getElementById('eqPurpose').value.trim(),
                verification_status: document.getElementById('eqStatus').value,
                main_parts: [],
                applications: [],
                safety_precautions: [],
                course: []
            };

            if (!data.name || !data.slug || !data.category) {
                alert('Please fill in all required fields.');
                return;
            }

            try {
                let result;
                if (editingId) {
                    result = await supabase
                        .from('equipment')
                        .update(data)
                        .eq('id', editingId);
                } else {
                    result = await supabase
                        .from('equipment')
                        .insert([data]);
                }

                if (result.error) throw result.error;

                alert(editingId ? '✅ Equipment updated!' : '✅ Equipment added!');
                closeModal();
                await loadEquipment();
            } catch (err) {
                alert('❌ Error: ' + err.message);
            }
        });

        async function deleteEquipment(id) {
            if (!confirm('Are you sure you want to delete this equipment?')) return;

            try {
                const { error } = await supabase
                    .from('equipment')
                    .delete()
                    .eq('id', id);

                if (error) throw error;

                alert('✅ Equipment deleted!');
                await loadEquipment();
            } catch (err) {
                alert('❌ Error: ' + err.message);
            }
        }

        // Close modal on overlay click
        document.getElementById('equipmentModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
    </script>
</body>
</html>
