<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f43f5e">
<meta name="description" content="Admin Users Management — view, verify, promote, and manage DiplomaHub user accounts.">
<meta name="robots" content="noindex, nofollow">

<meta property="og:type" content="website">
<meta property="og:title" content="Admin — Users — DiplomaHub">
<meta property="og:description" content="Manage DiplomaHub users.">
<meta property="og:url" content="https://alam-7.github.io/diploma-hub/admin-users.html">

<link rel="canonical" href="https://alam-7.github.io/diploma-hub/admin-users.html">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="assets/images/icon-192.png">

<title>Admin — Users — DiplomaHub</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

<style>
    /* ================= ADMIN THEME ================= */
    :root {
        --admin-primary: #f43f5e;
        --admin-primary-dark: #e11d48;
        --admin-glow: rgba(244, 63, 94, 0.15);
    }

    body { padding-top: 0; background: #0a0a1a; }

    /* ================= ADMIN NAV ================= */
    .admin-nav {
        position: fixed;
        top: 0; left: 0; right: 0;
        height: var(--nav-height);
        background: rgba(10, 10, 26, 0.95);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(244, 63, 94, 0.15);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 var(--space-lg);
        z-index: 1000;
        gap: 16px;
    }
    .admin-nav .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        color: var(--text);
        font-weight: 700;
        font-size: 1.1rem;
    }
    .admin-nav .brand i.shield {
        color: var(--admin-primary);
        font-size: 1.3rem;
    }
    .admin-nav .brand .badge {
        background: var(--admin-glow);
        color: var(--admin-primary);
        font-size: 0.6rem;
        font-weight: 800;
        padding: 2px 8px;
        border-radius: 6px;
        text-transform: uppercase;
        letter-spacing: 0.8px;
    }
    .admin-nav .nav-links-admin {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
    }
    .admin-nav .nav-links-admin a {
        color: var(--text-muted);
        font-size: 0.85rem;
        padding: 8px 14px;
        border-radius: var(--radius-pill);
        text-decoration: none;
        transition: var(--transition);
        display: inline-flex;
        align-items: center;
        gap: 6px;
    }
    .admin-nav .nav-links-admin a:hover {
        color: var(--admin-primary);
        background: var(--admin-glow);
    }
    .admin-nav .nav-links-admin a.active {
        color: var(--admin-primary);
        background: var(--admin-glow);
    }
    .admin-nav .user-menu {
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .admin-nav .user-avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--admin-primary), #f97316);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 0.85rem;
    }
    .admin-nav .logout-btn {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text-muted);
        padding: 7px 14px;
        border-radius: var(--radius-pill);
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition);
        display: inline-flex;
        align-items: center;
        gap: 6px;
    }
    .admin-nav .logout-btn:hover {
        border-color: var(--admin-primary);
        color: var(--admin-primary);
        background: var(--admin-glow);
    }

    /* ================= LAYOUT ================= */
    .admin-container {
        max-width: 1400px;
        margin: 0 auto;
        padding: calc(var(--nav-height) + 20px) var(--space-md) var(--space-xl);
    }

    .page-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: var(--space-lg);
    }
    .page-head h1 {
        font-size: 1.6rem;
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .page-head h1 i { color: var(--admin-primary); }
    .page-head .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }
    .page-head button, .page-head a {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 9px 16px;
        border-radius: var(--radius-pill);
        font-size: 0.85rem;
        font-weight: 600;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text-muted);
        cursor: pointer;
        transition: var(--transition);
        text-decoration: none;
    }
    .page-head button:hover, .page-head a:hover {
        border-color: var(--admin-primary);
        color: var(--admin-primary);
        background: var(--admin-glow);
    }
    .page-head .primary {
        background: var(--admin-primary);
        color: #fff;
        border-color: transparent;
    }
    .page-head .primary:hover {
        background: var(--admin-primary-dark);
        color: #fff;
        transform: translateY(-2px);
    }

    /* ================= STATS ================= */
    .admin-stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: var(--space-md);
        margin-bottom: var(--space-lg);
    }
    .admin-stat {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: var(--space-md);
        display: flex;
        align-items: center;
        gap: 12px;
        transition: var(--transition);
    }
    .admin-stat:hover {
        border-color: var(--admin-primary);
        transform: translateY(-2px);
    }
    .admin-stat .icon {
        width: 42px;
        height: 42px;
        min-width: 42px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.1rem;
        flex-shrink: 0;
        background: var(--admin-glow);
        color: var(--admin-primary);
    }
    .admin-stat .icon.green { background: rgba(34,197,94,0.15); color: #22c55e; }
    .admin-stat .icon.blue { background: rgba(0,212,255,0.15); color: #00d4ff; }
    .admin-stat .icon.amber { background: rgba(245,158,11,0.15); color: #f59e0b; }
    .admin-stat .icon.purple { background: rgba(168,85,247,0.15); color: #a855f7; }
    .admin-stat .num {
        font-size: 1.4rem;
        font-weight: 800;
        line-height: 1;
    }
    .admin-stat .label {
        font-size: 0.75rem;
        color: var(--text-muted);
        margin-top: 3px;
    }

    /* ================= FILTER BAR ================= */
    .filter-bar {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: var(--space-md);
        padding: var(--space-md);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
    }
    .filter-bar .search-wrap {
        flex: 1;
        min-width: 220px;
        position: relative;
    }
    .filter-bar .search-wrap i {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        pointer-events: none;
    }
    .filter-bar input { padding-left: 44px; }
    .filter-bar select { max-width: 160px; }

    /* ================= BULK ACTIONS ================= */
    .bulk-bar {
        display: none;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        background: var(--admin-glow);
        border: 1px solid var(--admin-primary);
        border-radius: var(--radius-md);
        margin-bottom: var(--space-md);
        font-size: 0.85rem;
        flex-wrap: wrap;
    }
    .bulk-bar.show { display: flex; }
    .bulk-bar .bulk-actions {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
    }
    .bulk-bar button {
        padding: 7px 14px;
        border-radius: var(--radius-pill);
        font-size: 0.78rem;
        font-weight: 600;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
        transition: var(--transition);
        display: inline-flex;
        align-items: center;
        gap: 5px;
    }
    .bulk-bar button:hover { border-color: var(--admin-primary); color: var(--admin-primary); }
    .bulk-bar button.danger { color: var(--error); border-color: rgba(239,68,68,0.3); }
    .bulk-bar button.danger:hover { background: rgba(239,68,68,0.1); border-color: var(--error); }

    /* ================= TABLE ================= */
    .table-wrap {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        overflow: hidden;
    }
    .table-scroll {
        overflow-x: auto;
    }
    table.users-table {
        width: 100%;
        border-collapse: collapse;
        min-width: 800px;
    }
    table.users-table th {
        background: rgba(0,0,0,0.3);
        padding: 14px 16px;
        text-align: left;
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.7px;
        color: var(--text-muted);
        white-space: nowrap;
    }
    table.users-table td {
        padding: 14px 16px;
        border-bottom: 1px solid var(--border);
        font-size: 0.88rem;
        vertical-align: middle;
    }
    table.users-table tbody tr {
        transition: var(--transition);
    }
    table.users-table tbody tr:hover {
        background: rgba(244,63,94,0.04);
    }
    table.users-table tbody tr:last-child td { border-bottom: none; }

    .u-info {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
    }
    .u-avatar {
        width: 38px;
        height: 38px;
        min-width: 38px;
        border-radius: 50%;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 0.85rem;
        letter-spacing: -0.5px;
        flex-shrink: 0;
    }
    .u-body { min-width: 0; }
    .u-name {
        font-weight: 600;
        color: var(--text);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 200px;
    }
    .u-email {
        font-size: 0.78rem;
        color: var(--text-muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 220px;
    }

    .role-badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 3px 10px;
        border-radius: var(--radius-pill);
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.4px;
    }
    .role-badge.admin { background: var(--admin-glow); color: var(--admin-primary); }
    .role-badge.moderator { background: rgba(168,85,247,0.15); color: #a855f7; }
    .role-badge.student { background: rgba(0,212,255,0.15); color: #00d4ff; }

    .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 3px 10px;
        border-radius: var(--radius-pill);
        font-size: 0.7rem;
        font-weight: 700;
    }
    .status-badge.verified { background: rgba(34,197,94,0.15); color: #22c55e; }
    .status-badge.unverified { background: rgba(245,158,11,0.15); color: #f59e0b; }
    .status-badge.blocked { background: rgba(239,68,68,0.15); color: #ef4444; }

    .actions-cell {
        display: flex;
        gap: 4px;
        flex-wrap: nowrap;
    }
    .icon-btn {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text-muted);
        width: 30px;
        height: 30px;
        border-radius: 8px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 0.78rem;
        transition: var(--transition);
        flex-shrink: 0;
    }
    .icon-btn:hover {
        border-color: var(--admin-primary);
        color: var(--admin-primary);
        background: var(--admin-glow);
    }
    .icon-btn.danger:hover {
        border-color: var(--error);
        color: var(--error);
        background: rgba(239,68,68,0.1);
    }
    .icon-btn.success:hover {
        border-color: var(--success);
        color: var(--success);
        background: rgba(34,197,94,0.1);
    }

    .checkbox-cell {
        width: 40px;
        text-align: center;
    }
    .checkbox-cell input[type="checkbox"] {
        appearance: none;
        -webkit-appearance: none;
        width: 18px;
        height: 18px;
        border: 2px solid var(--border);
        border-radius: 5px;
        cursor: pointer;
        position: relative;
        transition: var(--transition);
        background: var(--bg-alt);
        padding: 0;
    }
    .checkbox-cell input[type="checkbox"]:checked {
        background: var(--admin-primary);
        border-color: var(--admin-primary);
    }
    .checkbox-cell input[type="checkbox"]:checked::after {
        content: '✓';
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #fff;
        font-weight: 700;
        font-size: 0.72rem;
    }

    /* ================= PAGINATION ================= */
    .pagination {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        background: var(--bg-alt);
        border-top: 1px solid var(--border);
        flex-wrap: wrap;
    }
    .pagination .pg-info {
        font-size: 0.82rem;
        color: var(--text-muted);
    }
    .pagination .pg-controls {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
    }
    .pagination button {
        min-width: 34px;
        height: 34px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text-muted);
        font-size: 0.82rem;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition);
        display: inline-flex;
        align-items: center;
        justify-content: center;
    }
    .pagination button:hover:not(:disabled) {
        border-color: var(--admin-primary);
        color: var(--admin-primary);
    }
    .pagination button.active {
        background: var(--admin-primary);
        border-color: var(--admin-primary);
        color: #fff;
    }
    .pagination button:disabled {
        opacity: 0.35;
        cursor: not-allowed;
    }

    /* ================= EMPTY ================= */
    .empty-row {
        text-align: center;
        padding: 60px 20px;
        color: var(--text-muted);
    }
    .empty-row i {
        font-size: 2.5rem;
        color: var(--text-dim);
        display: block;
        margin-bottom: 10px;
    }

    /* ================= MODAL ================= */
    .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.85);
        backdrop-filter: blur(6px);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 2000;
        padding: 20px;
    }
    .modal-overlay.show { display: flex; }
    .modal-content {
        background: var(--bg-alt);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        max-width: 520px;
        width: 100%;
        max-height: 90vh;
        overflow-y: auto;
        padding: var(--space-xl);
        box-shadow: var(--shadow-lg);
    }
    .modal-content.lg { max-width: 640px; }
    .modal-content h3 {
        font-size: 1.15rem;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .modal-content h3 i { color: var(--admin-primary); }
    .modal-content p {
        color: var(--text-muted);
        font-size: 0.9rem;
        line-height: 1.6;
        margin-bottom: var(--space-lg);
    }
    .modal-actions {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        margin-top: var(--space-lg);
        flex-wrap: wrap;
    }
    .modal-actions button {
        padding: 11px 22px;
        border-radius: var(--radius-pill);
        font-size: 0.9rem;
        font-weight: 600;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
        transition: var(--transition);
    }
    .modal-actions button:hover {
        border-color: var(--admin-primary);
        color: var(--admin-primary);
    }
    .modal-actions button.danger {
        background: var(--error);
        color: #fff;
        border-color: transparent;
    }
    .modal-actions button.danger:hover {
        background: #dc2626;
        color: #fff;
    }
    .modal-actions button.primary {
        background: var(--admin-primary);
        color: #fff;
        border-color: transparent;
    }
    .modal-actions button.primary:hover {
        background: var(--admin-primary-dark);
        color: #fff;
    }

    .detail-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 0;
        border-bottom: 1px solid var(--border);
        font-size: 0.88rem;
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-row .d-label {
        color: var(--text-muted);
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .detail-row .d-label i { color: var(--admin-primary); }
    .detail-row .d-value {
        font-weight: 600;
        text-align: right;
        word-break: break-word;
    }

    /* Form in modal */
    .m-field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: var(--space-md);
    }
    .m-field label {
        font-size: 0.82rem;
        font-weight: 600;
    }
    .m-field input, .m-field select {
        width: 100%;
        font-size: 0.9rem;
    }

    /* ================= LOADING ================= */
    .loading-screen {
        text-align: center;
        padding: var(--space-2xl);
    }
    .loading-screen .spinner {
        width: 50px;
        height: 50px;
        border: 4px solid var(--surface);
        border-top-color: var(--admin-primary);
        border-radius: 50%;
        margin: 0 auto var(--space-md);
        animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Toast */
    .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%) translateY(100px);
        background: var(--bg-alt);
        border: 1px solid var(--admin-primary);
        color: var(--text);
        padding: 12px 24px;
        border-radius: var(--radius-pill);
        font-size: 0.88rem;
        font-weight: 600;
        box-shadow: var(--shadow-lg);
        z-index: 3000;
        opacity: 0;
        transition: all 0.3s ease;
    }
    .toast.show {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
    }
    .toast i { color: var(--admin-primary); margin-right: 6px; }

    @media (max-width: 900px) {
        .admin-nav { padding: 0 12px; }
        .admin-nav .nav-links-admin a span.nav-text { display: none; }
        .admin-nav .brand span.full-name { display: none; }
    }
    @media (max-width: 600px) {
        .admin-container { padding-left: 12px; padding-right: 12px; }
        .page-head h1 { font-size: 1.25rem; }
        .page-head .actions { width: 100%; }
        .page-head .actions > * { flex: 1; justify-content: center; }
        .filter-bar select { max-width: 100%; }
        table.users-table th, table.users-table td { padding: 10px 12px; font-size: 0.82rem; }
    }
</style>
</head>
<body>

<!-- ================= ADMIN NAV ================= -->
<nav class="admin-nav">
    <a href="admin-users.html" class="brand">
        <i class="fas fa-shield-alt shield"></i>
        <span class="full-name">DIPLOMA HUB</span>
        <span class="badge">Admin</span>
    </a>

    <div class="nav-links-admin">
        <a href="admin-users.html" class="active">
            <i class="fas fa-users"></i> <span class="nav-text">Users</span>
        </a>
        <a href="admin-equipment.html">
            <i class="fas fa-tools"></i> <span class="nav-text">Equipment</span>
        </a>
        <a href="admin-verify.html">
            <i class="fas fa-check-circle"></i> <span class="nav-text">Verify</span>
        </a>
        <a href="dashboard.html">
            <i class="fas fa-user"></i> <span class="nav-text">Site</span>
        </a>
    </div>

    <div class="user-menu">
        <div class="user-avatar" id="adminAvatar">A</div>
        <button class="logout-btn" onclick="handleLogout()">
            <i class="fas fa-sign-out-alt"></i> Logout
        </button>
    </div>
</nav>

<!-- ================= MAIN ================= -->
<div class="admin-container">

    <!-- LOADING -->
    <div id="loading" class="loading-screen">
        <div class="spinner"></div>
        <p class="text-muted">Loading users…</p>
    </div>

    <!-- CONTENT -->
    <div id="content" style="display:none;">

        <!-- PAGE HEAD -->
        <div class="page-head">
            <h1><i class="fas fa-users"></i> Users Management</h1>
            <div class="actions">
                <button onclick="openAddUser()" class="primary">
                    <i class="fas fa-user-plus"></i> Add User
                </button>
                <button onclick="exportCSV()">
                    <i class="fas fa-download"></i> Export CSV
                </button>
                <button onclick="refreshUsers()">
                    <i class="fas fa-sync"></i> Refresh
                </button>
            </div>
        </div>

        <!-- STATS -->
        <div class="admin-stats" id="statsGrid"></div>

        <!-- FILTER -->
        <div class="filter-bar">
            <div class="search-wrap">
                <i class="fas fa-search"></i>
                <input type="text"

    </div>

</div>

<!-- ================= SCRIPTS ================= -->
<script>
// ============================================================
// CONFIG
// ============================================================
const ADMIN_SESSION_KEY = 'dh_admin_session';
const MOCK_USERS_KEY = 'dh_mock_users';

// ============================================================
// STATE
// ============================================================
let allUsers = [];
let filteredUsers = [];
let selectedIds = new Set();
let currentPage = 1;
const PAGE_SIZE = 10;
let currentAdmin = null;

// ============================================================
// HELPERS
// ============================================================
function escapeHtml(str) {
    if (str == null) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function showToast(msg) {
    const t = document.getElementById('toast');
    document.getElementById('toastMsg').textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
}

function getAdminSession() {
    try {
        const s = localStorage.getItem(ADMIN_SESSION_KEY) || sessionStorage.getItem(ADMIN_SESSION_KEY);
        if (!s) return null;
        const p = JSON.parse(s);
        if (p.expiresAt && p.expiresAt < Date.now()) return null;
        if (p.role !== 'admin' && p.role !== 'moderator') return null;
        return p;
    } catch (e) { return null; }
}

function getAvatarColor(email) {
    const colors = ['#00d4ff', '#a855f7', '#f59e0b', '#22c55e', '#ef4444', '#06b6d4', '#8b5cf6', '#10b981'];
    let hash = 0;
    for (let i = 0; i < email.length; i++) hash = email.charCodeAt(i) + ((hash << 5) - hash);
    return colors[Math.abs(hash) % colors.length];
}

function getInitials(name, email) {
    const src = (name || email || 'U').trim();
    const parts = src.split(/\s+/);
    if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
    return src.substring(0, 2).toUpperCase();
}

function formatDate(ts) {
    if (!ts) return '—';
    const d = new Date(ts);
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

// ============================================================
// DATA LOADING
// ============================================================
async function loadUsers() {
    document.getElementById('loading').style.display = 'block';
    document.getElementById('content').style.display = 'none';

    try {
        // ============ SUPABASE ============
        if (window.supabaseClient && typeof window.supabaseClient.from === 'function') {
            const { data, error } = await window.supabaseClient
                .from('profiles')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) throw new Error(error.message);

            allUsers = (data || []).map(u => ({
                id: u.id,
                name: u.name || 'Unnamed',
                email: u.email || '',
                role: u.role || 'student',
                verified: !!u.verified,
                blocked: !!u.blocked,
                createdAt: u.created_at ? new Date(u.created_at).getTime() : Date.now()
            }));
        } else {
            // ============ MOCK ============
            await new Promise(r => setTimeout(r, 500));
            allUsers = loadMockUsers();
        }

        updateStats();
        applyFilters();

        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';

    } catch (err) {
        console.error('Load users error:', err);
        showToast('Failed to load users');
        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';
    }
}

function loadMockUsers() {
    try {
        const stored = JSON.parse(localStorage.getItem(MOCK_USERS_KEY));
        if (stored && stored.length) return stored;
    } catch (e) {}

    // Seed demo users
    const demo = [
        { id: 'u1', name: 'Aditya Sharma', email: 'aditya@diplomahub.app', role: 'admin', verified: true, blocked: false, createdAt: Date.now() - 30 * 86400000 },
        { id: 'u2', name: 'Priya Patil', email: 'priya@diplomahub.app', role: 'moderator', verified: true, blocked: false, createdAt: Date.now() - 20 * 86400000 },
        { id: 'u3', name: 'Rahul Deshmukh', email: 'rahul@diplomahub.app', role: 'student', verified: true, blocked: false, createdAt: Date.now() - 15 * 86400000 },
        { id: 'u4', name: 'Sneha Kulkarni', email: 'sneha@diplomahub.app', role: 'student', verified: false, blocked: false, createdAt: Date.now() - 10 * 86400000 },
        { id: 'u5', name: 'Vikram Joshi', email: 'vikram@diplomahub.app', role: 'student', verified: true, blocked: true, createdAt: Date.now() - 8 * 86400000 },
        { id: 'u6', name: 'Anjali Rao', email: 'anjali@diplomahub.app', role: 'student', verified: true, blocked: false, createdAt: Date.now() - 6 * 86400000 },
        { id: 'u7', name: 'Karan Mehta', email: 'karan@diplomahub.app', role: 'student', verified: false, blocked: false, createdAt: Date.now() - 4 * 86400000 },
        { id: 'u8', name: 'Divya Nair', email: 'divya@diplomahub.app', role: 'student', verified: true, blocked: false, createdAt: Date.now() - 2 * 86400000 },
        { id: 'u9', name: 'Rohan Gupta', email: 'rohan@diplomahub.app', role: 'student', verified: false, blocked: false, createdAt: Date.now() - 86400000 },
        { id: 'u10', name: 'Neha Verma', email: 'neha@diplomahub.app', role: 'student', verified: true, blocked: false, createdAt: Date.now() - 3600000 },
        { id: 'u11', name: 'Arjun Singh', email: 'arjun@diplomahub.app', role: 'student', verified: true, blocked: false, createdAt: Date.now() - 7200000 },
        { id: 'u12', name: 'Pooja Shah', email: 'pooja@diplomahub.app', role: 'student', verified: false, blocked: true, createdAt: Date.now() - 10800000 }
    ];
    localStorage.setItem(MOCK_USERS_KEY, JSON.stringify(demo));
    return demo;
}

function saveMockUsers() {
    if (!window.supabaseClient) {
        localStorage.setItem(MOCK_USERS_KEY, JSON.stringify(allUsers));
    }
}

// ============================================================
// STATS
// ============================================================
function updateStats() {
    const total = allUsers.length;
    const admins = allUsers.filter(u => u.role === 'admin').length;
    const mods = allUsers.filter(u => u.role === 'moderator').length;
    const verified = allUsers.filter(u => u.verified).length;
    const blocked = allUsers.filter(u => u.blocked).length;

    const stats = [
        { icon: 'fa-users', cls: '', num: total, label: 'Total Users' },
        { icon: 'fa-user-shield', cls: '', num: admins, label: 'Admins' },
        { icon: 'fa-user-tie', cls: 'purple', num: mods, label: 'Moderators' },
        { icon: 'fa-check-circle', cls: 'green', num: verified, label: 'Verified' },
        { icon: 'fa-ban', cls: 'amber', num: blocked, label: 'Blocked' }
    ];
    document.getElementById('statsGrid').innerHTML = stats.map(s => `
        <div class="admin-stat">
            <div class="icon ${s.cls}"><i class="fas ${s.icon}"></i></div>
            <div>
                <div class="num">${s.num}</div>
                <div class="label">${s.label}</div>
            </div>
        </div>
    `).join('');
}

// ============================================================
// FILTERS
// ============================================================
function applyFilters() {
    const q = document.getElementById('searchInput').value.toLowerCase().trim();
    const role = document.getElementById('roleFilter').value;
    const status = document.getElementById('statusFilter').value;
    const sort = document.getElementById('sortSelect').value;

    filteredUsers = allUsers.filter(u => {
        const matchQ = !q ||
            (u.name || '').toLowerCase().includes(q) ||
            (u.email || '').toLowerCase().includes(q) ||
            String(u.id).toLowerCase().includes(q);
        const matchR = role === 'all' || u.role === role;
        let matchS = true;
        if (status === 'verified') matchS = u.verified && !u.blocked;
        else if (status === 'unverified') matchS = !u.verified && !u.blocked;
        else if (status === 'blocked') matchS = u.blocked;
        return matchQ && matchR && matchS;
    });

    if (sort === 'newest') filteredUsers.sort((a, b) => b.createdAt - a.createdAt);
    else if (sort === 'oldest') filteredUsers.sort((a, b) => a.createdAt - b.createdAt);
    else if (sort === 'az') filteredUsers.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
    else if (sort === 'za') filteredUsers.sort((a, b) => (b.name || '').localeCompare(a.name || ''));

    currentPage = 1;
    renderTable();
    renderPagination();
}

// ============================================================
// RENDER TABLE
// ============================================================
function renderTable() {
    const tbody = document.getElementById('usersTable');
    const start = (currentPage - 1) * PAGE_SIZE;
    const pageUsers = filteredUsers.slice(start, start + PAGE_SIZE);

    if (!pageUsers.length) {
        tbody.innerHTML = `
            <tr>
                <td colspan="6">
                    <div class="empty-row">
                        <i class="fas fa-users-slash"></i>
                        <p>No users found</p>
                    </div>
                </td>
            </tr>
        `;
        return;
    }

    tbody.innerHTML = pageUsers.map(u => {
        const initials = getInitials(u.name, u.email);
        const color = getAvatarColor(u.email || u.id);
        const isSelected = selectedIds.has(u.id);

        let statusBadge = '';
        if (u.blocked) statusBadge = '<span class="status-badge blocked"><i class="fas fa-ban"></i> Blocked</span>';
        else if (u.verified) statusBadge = '<span class="status-badge verified"><i class="fas fa-check-circle"></i> Verified</span>';
        else statusBadge = '<span class="status-badge unverified"><i class="fas fa-clock"></i> Unverified</span>';

        return `
            <tr>
                <td class="checkbox-cell">
                    <input type="checkbox"
                           ${isSelected ? 'checked' : ''}
                           onchange="toggleSelect('${u.id}', this.checked)">
                </td>
                <td>
                    <div class="u-info">
                        <div class="u-avatar" style="background:linear-gradient(135deg,${color},${color}dd);">
                            ${initials}
                        </div>
                        <div class="u-body">
                            <div class="u-name">${escapeHtml(u.name)}</div>
                            <div class="u-email">${escapeHtml(u.email)}</div>
                        </div>
                    </div>
                </td>
                <td>
                    <span class="role-badge ${u.role}">
                        <i class="fas fa-${u.role === 'admin' ? 'user-shield' : u.role === 'moderator' ? 'user-tie' : 'user'}"></i>
                        ${u.role}
                    </span>
                </td>
                <td>${statusBadge}</td>
                <td>${formatDate(u.createdAt)}</td>
                <td>
                    <div class="actions-cell">
                        <button class="icon-btn" onclick="viewUser('${u.id}')" title="View details">
                            <i class="fas fa-eye"></i>
                        </button>
                        ${!u.verified ? `
                            <button class="icon-btn success" onclick="quickAction('verify','${u.id}')" title="Verify">
                                <i class="fas fa-check"></i>
                            </button>
                        ` : ''}
                        <button class="icon-btn ${u.blocked ? 'success' : 'danger'}"
                                onclick="quickAction('${u.blocked ? 'unblock' : 'block'}','${u.id}')"
                                title="${u.blocked ? 'Unblock' : 'Block'}">
                            <i class="fas fa-${u.blocked ? 'unlock' : 'ban'}"></i>
                        </button>
                        <button class="icon-btn danger" onclick="quickAction('delete','${u.id}')" title="Delete">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </td>
            </tr>
        `;
    }).join('');

    document.getElementById('selectAll').checked =
        pageUsers.length > 0 && pageUsers.every(u => selectedIds.has(u.id));
}

// ============================================================
// PAGINATION
// ============================================================
function renderPagination() {
    const total = filteredUsers.length;
    const totalPages = Math.ceil(total / PAGE_SIZE) || 1;
    const start = total === 0 ? 0 : (currentPage - 1) * PAGE_SIZE + 1;
    const end = Math.min(currentPage * PAGE_SIZE, total);

    document.getElementById('pagination').innerHTML = `
        <div class="pg-info">
            Showing <strong>${start}</strong>–<strong>${end}</strong> of <strong>${total}</strong> users
        </div>
        <div class="pg-controls">
            <button onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>
                <i class="fas fa-chevron-left"></i>
            </button>
            ${buildPageNumbers(currentPage, totalPages)}
            <button onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>
    `;
}

function buildPageNumbers(current, total) {
    const pages = [];
    for (let i = 1; i <= total; i++) {
        if (i === 1 || i === total || Math.abs(i - current) <= 1) {
            pages.push(`<button class="${i === current ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`);
        } else if (pages[pages.length - 1] !== '<span style="color:var(--text-dim);padding:0 6px;">…</span>') {
            pages.push('<span style="color:var(--text-dim);padding:0 6px;">…</span>');
        }
    }
    return pages.join('');
}

function goToPage(p) {
    const totalPages = Math.ceil(filteredUsers.length / PAGE_SIZE) || 1;
    if (p < 1 || p > totalPages) return;
    currentPage = p;
    renderTable();
    renderPagination();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ============================================================
// SELECTION
// ============================================================
function toggleSelect(id, checked) {
    if (checked) selectedIds.add(id);
    else selectedIds.delete(id);
    updateBulkBar();
    renderTable();
}

function toggleSelectAll(el) {
    const start = (currentPage - 1) * PAGE_SIZE;
    const pageUsers = filteredUsers.slice(start, start + PAGE_SIZE);
    if (el.checked) pageUsers.forEach(u => selectedIds.add(u.id));
    else pageUsers.forEach(u => selectedIds.delete(u.id));
    updateBulkBar();
    renderTable();
}

function updateBulkBar() {
    const bar = document.getElementById('bulkBar');
    document.getElementById('bulkCount').textContent = selectedIds.size;
    bar.classList.toggle('show', selectedIds.size > 0);
}

function clearSelection() {
    selectedIds.clear();
    updateBulkBar();
    renderTable();
}

// ============================================================
// ACTIONS
// ============================================================
function quickAction(action, id) {
    const user = allUsers.find(u => u.id === id);
    if (!user) return;

    if (action === 'delete') {
        confirmAction(
            'Delete user?',
            `Permanently delete <strong>${escapeHtml(user.name)}</strong>? This cannot be undone.`,
            () => performAction('delete', [id])
        );
        return;
    }

    if (action === 'verify') {
        confirmAction(
            'Verify user?',
            `Mark <strong>${escapeHtml(user.name)}</strong> as verified?`,
            () => performAction('verify', [id])
        );
        return;
    }

    if (action === 'block') {
        confirmAction(
            'Block user?',
            `Block <strong>${escapeHtml(user.name)}</strong>? They will be unable to sign in.`,
            () => performAction('block', [id])
        );
        return;
    }

    if (action === 'unblock') {
        performAction('unblock', [id]);
    }
}

function bulkAction(action) {
    const ids = [...selectedIds];
    if (!ids.length) return;

    const labels = {
        verify: `Verify ${ids.length} user(s)?`,
        block: `Block ${ids.length} user(s)?`,
        unblock: `Unblock ${ids.length} user(s)?`,
        delete: `Permanently delete ${ids.length} user(s)?`
    };
    const msgs = {
        verify: 'They will be marked as verified.',
        block: 'Blocked users cannot sign in.',
        unblock: 'They will regain access.',
        delete: 'This action cannot be undone.'
    };

    if (action === 'delete' || action === 'block') {
        confirmAction(labels[action], msgs[action], () => performAction(action, ids));
    } else {
        performAction(action, ids);
    }
}

async function performAction(action, ids) {
    try {
        // ============ SUPABASE ============
        if (window.supabaseClient && typeof window.supabaseClient.from === 'function') {
            const updates = {};
            if (action === 'verify') updates.verified = true;
            else if (action === 'block') updates.blocked = true;
            else if (action === 'unblock') updates.blocked = false;

            if (action === 'delete') {
                const { error } = await window.supabaseClient
                    .from('profiles')
                    .delete()
                    .in('id', ids);
                if (error) throw new Error(error.message);
            } else {
                const { error } = await window.supabaseClient
                    .from('profiles')
                    .update(updates)
                    .in('id', ids);
                if (error) throw new Error(error.message);
            }
        }

        // Update local
        if (action === 'delete') {
            allUsers = allUsers.filter(u => !ids.includes(u.id));
            ids.forEach(id => selectedIds.delete(id));
        } else {
            allUsers.forEach(u => {
                if (ids.includes(u.id)) {
                    if (action === 'verify') u.verified = true;
                    else if (action === 'block') u.blocked = true;
                    else if (action === 'unblock') u.blocked = false;
                }
            });
        }

        saveMockUsers();
        updateStats();
        applyFilters();
        updateBulkBar();
        showToast(`Action "${action}" completed`);

    } catch (err) {
        console.error('Action error:', err);
        showToast('Action failed: ' + (err.message || 'Unknown error'));
    }
}

// ============================================================
// VIEW USER
// ============================================================
function viewUser(id) {

    const initials = getInitials(u.name, u.email);

        <div style="text-align:center;margin-bottom:20px;">

                ${initials}
            </div>
            <div style="font-size:1.15rem;font-weight:700;">${escapeHtml(u.name)}</div>
            <div style="color:var(--text-muted);font-size:0.85rem;">${escapeHtml(u.email)}</div>
        </div>
        <div class="detail-row">
            <span class="d-label"><i class="fas fa-hashtag"></i> User ID</span>
            <span class="d-value">${escapeHtml(u.id).slice(0, 16)}…</span>
        </div>
        <div class="detail-row">
            <span class="d-label"><i class="fas fa-user-tag"></i> Role</span>
            <span class="d-value">
                <span class="role-badge ${u.role}">
                    <i class="fas fa-${u.role === 'admin' ? 'user-shield' : u.role === 'moderator' ? 'user-tie' : 'user'}"></i>
                    ${u.role}
                </span>
            </span>
        </div>
        <div class="detail-row">
            <span class="d-label"><i class="fas fa-circle-check"></i> Status</span>
            <span class="d-value">
                ${u.blocked ? '<span style="color:var(--error);">Blocked</span>'
                    : u.verified ? '<span style="color:var(--success);">Verified</span>'
                    : '<span style="color:var(--warning);">Unverified</span>'}
            </span>
        </div>
        <div class="detail-row">
            <span class="d-label"><i class="fas fa-calendar"></i> Joined</span>
            <span class="d-value">${formatDate(u.createdAt)}</span>
        </div>
    `;

    document.getElementById('viewModal').classList.add('show');
}

// ============================================================
// ADD USER
// ============================================================
function openAddUser() {
    document.getElementById('addName').value = '';
    document.getElementById('addEmail').value = '';
    document.getElementById('addRole').value = 'student';
    document.getElementById('addModal').classList.add('show');
}

async function createUser() {
    const name = document.getElementById('addName').value.trim();
    const email = document.getElementById('addEmail').value.trim().toLowerCase();
    const role = document.getElementById('addRole').value;

    if (!name || name.length < 2) return showToast('Enter a valid name');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showToast('Enter a valid email');
    if (allUsers.some(u => u.email === email)) return showToast('Email already exists');

    try {
        if (window.supabaseClient && typeof window.supabaseClient.from === 'function') {
            const { error } = await window.supabaseClient.from('profiles').insert([{
                name, email, role, verified: false, blocked: false
            }]);
            if (error) throw new Error(error.message);
        }

        const newUser = {
            id: 'u-' + Date.now(),
            name, email, role,
            verified: false,
            blocked: false,
            createdAt: Date.now()
        };

        allUsers.unshift(newUser);
        saveMockUsers();
        updateStats();
        applyFilters();
        closeModal('addModal');
        showToast('User created!');

    } catch (err) {
        console.error(err);
        showToast('Failed: ' + err.message);
    }
}

// ============================================================
// CONFIRM MODAL
// ============================================================
let confirmCallback = null;
function confirmAction(title, msg, cb) {
    document.getElementById('confirmTitle').innerHTML =
        '<i class="fas fa-exclamation-triangle"></i> ' + escapeHtml(title);
    document.getElementById('confirmMsg').innerHTML = msg;
    confirmCallback = cb;
    document.getElementById('confirmBtn').onclick = () => {
        closeModal('confirmModal');
        if (confirmCallback) confirmCallback();
    };
    document.getElementById('confirmModal').classList.add('show');
}

function closeModal(id) {
    document.getElementById(id).classList.remove('show');
}

// ============================================================
// EXPORT CSV
// ============================================================
function exportCSV() {
    if (!filteredUsers.length) return showToast('No users to export');

    const headers = ['ID', 'Name', 'Email', 'Role', 'Verified', 'Blocked', 'Joined'];
    const rows = filteredUsers.map(u => [
        u.id,
        u.name,
        u.email,
        u.role,
        u.verified ? 'Yes' : 'No',
        u.blocked ? 'Yes' : 'No',
        formatDate(u.createdAt)
    ]);

    const csv = [headers, ...rows]
        .map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(','))
        .join('\n');

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `diplomahub-users-${Date.now()}.csv`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('Exported ' + filteredUsers.length + ' users');
}

// ============================================================
// REFRESH
// ============================================================
function refreshUsers() {
    showToast('Refreshing…');
    loadUsers();
}

// ============================================================
// LOGOUT
// ============================================================
function handleLogout() {
    if (!confirm('Sign out of admin panel?')) return;
    localStorage.removeItem(ADMIN_SESSION_KEY);
    sessionStorage.removeItem(ADMIN_SESSION_KEY);
    showToast('Signed out');
    setTimeout(() => { window.location.href = 'admin-login.html'; }, 700);
}

// ============================================================
// INIT
// ============================================================
(function init() {
    currentAdmin = getAdminSession();
    if (!currentAdmin) {
        window.location.href = 'admin-login.html';
        return;
    }

    // Set admin avatar
    const initials = getInitials(currentAdmin.user.name, currentAdmin.user.email);
    document.getElementById('adminAvatar').textContent = initials;

    // Load users
    loadUsers();
})();

// KEYBOARD: ESC closes modals
// ============================================================
document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
        document.querySelectorAll('.modal-overlay.show').forEach(m => m.classList.remove('show'));
    }
});

// PWA
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js')
            .then(() => console.log('✅ SW registered'))
            .catch(err => console.warn('SW failed:', err));
    });
}
