<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - DIPLOMA HUB</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- ✅ Only 1 line added: Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 20px 60px;
        }
        .auth-card {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 50px 40px;
            max-width: 420px;
            width: 100%;
        }
        .auth-card h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 8px;
        }
        .auth-card p {
            text-align: center;
            color: var(--gray-400);
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: var(--gray-300);
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--glass-border);
            background: var(--glass);
            color: var(--white);
            font-size: 1rem;
            transition: var(--transition);
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--cyan-400);
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.1);
        }
        .form-group input::placeholder {
            color: var(--gray-500);
        }
        .btn-block {
            width: 100%;
            justify-content: center;
            margin-top: 10px;
        }
        .auth-footer {
            text-align: center;
            margin-top: 20px;
            color: var(--gray-400);
        }
        .auth-footer a {
            color: var(--cyan-400);
            font-weight: 500;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <h1>Welcome Back</h1>
            <p>Sign in to continue your learning journey</p>

            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="signup.html">Create one now</a>
            </div>
        </div>
    </div>

    <!-- ✅ Only 1 script: auth.js -->
    <script src="js/auth.js"></script>

    <!-- ✅ Minimal, clean login handler -->
    <script>
        // Initialize Supabase when page loads
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof initSupabase === 'function') {
                initSupabase();
            }
        });

        // Clean login function
        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            if (typeof signIn === 'function') {
                await signIn(email, password);
            } else {
                alert('Authentication not loaded. Please refresh.');
            }
        }
    </script>
</body>
</html>
