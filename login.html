<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - DIPLOMA HUB</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- ✅ SUPABASE CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 20px 60px;
        }
        .auth-card {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 50px 40px;
            max-width: 420px;
            width: 100%;
        }
        .auth-card h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 8px;
        }
        .auth-card p {
            text-align: center;
            color: var(--gray-400);
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: var(--gray-300);
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--glass-border);
            background: var(--glass);
            color: var(--white);
            font-size: 1rem;
            transition: var(--transition);
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--cyan-400);
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.1);
        }
        .form-group input::placeholder {
            color: var(--gray-500);
        }
        .btn-block {
            width: 100%;
            justify-content: center;
            margin-top: 10px;
        }
        .auth-footer {
            text-align: center;
            margin-top: 20px;
            color: var(--gray-400);
        }
        .auth-footer a {
            color: var(--cyan-400);
            font-weight: 500;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <h1>Welcome Back</h1>
            <p>Sign in to continue your learning journey</p>

            <!-- ✅ FIXED: Using id instead of onsubmit -->
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password" required>
                </div>

                <!-- ✅ FIXED: type="submit" works with addEventListener -->
                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="signup.html">Create one now</a>
            </div>
        </div>
    </div>

    <!-- ✅ auth.js -->
    <script src="js/auth.js"></script>

    <!-- ✅ FIXED: Clean login handler -->
    <script>
        // Wait for page to load
        document.addEventListener('DOMContentLoaded', function() {
            console.log('✅ Login page loaded');
            
            // Check if auth.js loaded
            if (typeof initSupabase !== 'function') {
                alert('⚠️ Authentication not loaded. Please refresh.');
                return;
            }
            
            // Initialize Supabase
            initSupabase();
            console.log('✅ Supabase initialized');
        });

        // ✅ FIXED: Using addEventListener instead of onsubmit
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            // ✅ FIXED: Prevents page refresh
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            
            if (!email || !password) {
                alert('Please enter both email and password');
                return;
            }
            
            console.log('🔐 Attempting login for:', email);
            
            // ✅ FIXED: Check if signIn exists
            if (typeof signIn === 'function') {
                try {
                    await signIn(email, password);
                } catch (err) {
                    console.error('❌ Login error:', err);
                    alert('❌ Login failed: ' + err.message);
                }
            } else {
                alert('❌ Authentication not loaded. Please refresh.');
                console.error('❌ signIn function not found');
            }
        });
    </script>
</body>
</html>
