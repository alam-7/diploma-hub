<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Take Quiz - DIPLOMA HUB</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .quiz-container {
            padding: 100px 20px 60px;
            max-width: 800px;
            margin: 0 auto;
        }
        .quiz-header {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 25px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .quiz-header .title {
            font-size: 1.3rem;
            font-weight: 600;
        }
        .quiz-header .timer {
            color: var(--cyan-400);
            font-weight: 600;
            font-size: 1.2rem;
        }
        .quiz-header .timer.warning {
            color: #ef4444;
        }
        .question-card {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 30px;
            margin-bottom: 20px;
        }
        .question-card .q-number {
            font-size: 0.85rem;
            color: var(--gray-500);
            margin-bottom: 10px;
        }
        .question-card .q-text {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .options label {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            background: var(--glass);
            border: 2px solid var(--glass-border);
            border-radius: 10px;
            cursor: pointer;
            transition: var(--transition);
        }
        .options label:hover {
            border-color: var(--cyan-400);
        }
        .options input[type="radio"] {
            accent-color: var(--cyan-400);
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .options label.selected {
            border-color: var(--cyan-400);
            background: rgba(6, 182, 212, 0.1);
        }
        .options label.correct {
            border-color: #22c55e;
            background: rgba(34, 197, 94, 0.1);
        }
        .options label.wrong {
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
        }
        .quiz-nav {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .quiz-nav .q-nav {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .quiz-nav .q-nav button {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            border: 1px solid var(--glass-border);
            background: var(--glass);
            color: var(--white);
            cursor: pointer;
            transition: var(--transition);
            font-weight: 600;
        }
        .quiz-nav .q-nav button:hover {
            border-color: var(--cyan-400);
        }
        .quiz-nav .q-nav button.answered {
            background: var(--cyan-500);
            border-color: var(--cyan-500);
        }
        .quiz-nav .q-nav button.current {
            border-color: var(--cyan-400);
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.2);
        }
        .result-card {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 40px;
            text-align: center;
        }
        .result-card .score {
            font-size: 4rem;
            font-weight: 800;
            color: var(--cyan-400);
        }
        .result-card .label {
            color: var(--gray-400);
            font-size: 1.1rem;
        }
        .result-card .details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin: 25px 0;
        }
        .result-card .details div {
            background: var(--glass);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
        }
        .result-card .details .num {
            font-size: 1.8rem;
            font-weight: 700;
        }
        .result-card .details .num.green { color: #22c55e; }
        .result-card .details .num.red { color: #ef4444; }
        .result-card .details .num.yellow { color: #eab308; }
        @media (max-width: 600px) {
            .result-card .details {
                grid-template-columns: 1fr;
            }
            .quiz-header {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <i class="fas fa-graduation-cap"></i>
                <span>DIPLOMA<span class="highlight">HUB</span></span>
            </div>
            <div class="nav-links" id="navLinks">
                <a href="index.html">Home</a>
                <a href="courses.html">Courses</a>
                <a href="equipment.html">Equipment</a>
                <a href="practicals.html">Practicals</a>
                <a href="quizzes.html">Quizzes</a>
            </div>
            <div class="nav-right">
                <button class="theme-toggle" onclick="toggleTheme()">
                    <i class="fas fa-moon" id="themeIcon"></i>
                </button>
                <a href="login.html" class="btn btn-primary btn-sm" id="authBtn">Sign In</a>
                <button class="mobile-menu-btn" onclick="toggleMobileMenu()">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </div>
    </nav>

    <div class="quiz-container" id="quizApp">
        <!-- Quiz content rendered by JavaScript -->
    </div>

    <footer class="footer">
        <div class="container">
            <div class="footer-grid">
                <div class="footer-col">
                    <h3>DIPLOMA HUB</h3>
                    <p>"Understand Engineering. Learn Practically. Build the Future."</p>
                </div>
                <div class="footer-col">
                    <h4>Quick Links</h4>
                    <a href="courses.html">Courses</a>
                    <a href="equipment.html">Equipment</a>
                    <a href="practicals.html">Practicals</a>
                    <a href="quizzes.html">Quizzes</a>
                </div>
                <div class="footer-col">
                    <h4>Support</h4>
                    <a href="about.html">About</a>
                    <a href="contact.html">Contact</a>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2024 DIPLOMA HUB. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // ============================================
        // QUIZ ENGINE - COMPLETE
        // ============================================
        const QUIZ_DATA = {
            id: 1,
            title: 'Programming Fundamentals Quiz',
            questions: [
                {
                    id: 1,
                    question: 'What is the correct way to declare a variable in JavaScript?',
                    options: ['var x = 5;', 'int x = 5;', 'x = 5;', 'let x = 5;'],
                    correct: 3,
                    explanation: 'In JavaScript, you can use let, const, or var. Modern JavaScript uses let or const.'
                },
                {
                    id: 2,
                    question: 'What does HTML stand for?',
                    options: ['Hyper Text Markup Language', 'High Tech Modern Language', 'Hyper Transfer Markup Language', 'Home Tool Markup Language'],
                    correct: 0,
                    explanation: 'HTML stands for Hyper Text Markup Language - the standard markup language for web pages.'
                },
                {
                    id: 3,
                    question: 'Which tag is used to create a hyperlink in HTML?',
                    options: ['<link>', '<a>', '<href>', '<url>'],
                    correct: 1,
                    explanation: 'The <a> tag (anchor) is used to create hyperlinks in HTML.'
                },
                {
                    id: 4,
                    question: 'What is the correct CSS syntax to change text color to blue?',
                    options: ['color: blue;', 'text-color: blue;', 'font-color: blue;', 'color: #blue;'],
                    correct: 0,
                    explanation: 'The CSS property "color" sets the text color.'
                },
                {
                    id: 5,
                    question: 'What does CSS stand for?',
                    options: ['Cascading Style Sheets', 'Computer Style Sheets', 'Creative Style Sheets', 'Colorful Style Sheets'],
                    correct: 0,
                    explanation: 'CSS stands for Cascading Style Sheets - used to style web pages.'
                },
                {
                    id: 6,
                    question: 'Which of the following is NOT a programming language?',
                    options: ['Python', 'HTML', 'JavaScript', 'Java'],
                    correct: 1,
                    explanation: 'HTML is a markup language, not a programming language. It structures content.'
                },
                {
                    id: 7,
                    question: 'How do you write a comment in JavaScript?',
                    options: ['// comment', '<!-- comment -->', '# comment', '/* comment */'],
                    correct: 0,
                    explanation: 'In JavaScript, // is used for single-line comments.'
                },
                {
                    id: 8,
                    question: 'Which HTML element is used for the largest heading?',
                    options: ['<heading>', '<h1>', '<head>', '<h6>'],
                    correct: 1,
                    explanation: '<h1> is the largest heading element in HTML.'
                }
            ]
        };

        let currentQuestion = 0;
        let answers = [];
        let timer = 600; // 10 minutes
        let timerInterval;
        let quizStarted = false;

        function renderQuiz() {
            const app = document.getElementById('quizApp');
            if (!quizStarted) {
                app.innerHTML = `
                    <div class="question-card" style="text-align: center; padding: 40px;">
                        <div style="font-size: 4rem; margin-bottom: 20px;">📝</div>
                        <h2 style="font-size: 2rem; margin-bottom: 10px;">${QUIZ_DATA.title}</h2>
                        <p style="color: var(--gray-400);">${QUIZ_DATA.questions.length} questions</p>
                        <p style="color: var(--gray-400);">Time Limit: 10 minutes</p>
                        <button class="btn btn-primary btn-lg" onclick="startQuiz()" style="margin-top: 20px;">
                            <i class="fas fa-play"></i> Start Quiz
                        </button>
                    </div>
                `;
                return;
            }

            const q = QUIZ_DATA.questions[currentQuestion];
            const total = QUIZ_DATA.questions.length;
            const answered = answers[currentQuestion] !== undefined;

            let optionsHtml = q.options.map((opt, idx) => {
                let classes = 'option-item';
                let selected = answers[currentQuestion] === idx;
                if (selected) classes += ' selected';
                return `
                    <label class="${classes}" onclick="selectOption(${idx})">
                        <input type="radio" name="question" ${selected ? 'checked' : ''}>
                        ${opt}
                    </label>
                `;
            }).join('');

            app.innerHTML = `
                <div class="quiz-header">
                    <div class="title">${QUIZ_DATA.title}</div>
                    <div class="timer" id="timerDisplay">⏱️ ${formatTime(timer)}</div>
                </div>

                <div class="question-card">
                    <div class="q-number">Question ${currentQuestion + 1} of ${total}</div>
                    <div class="q-text">${q.question}</div>
                    <div class="options">${optionsHtml}</div>
                </div>

                <div class="quiz-nav">
                    <button class="btn btn-outline" onclick="prevQuestion()" ${currentQuestion === 0 ? 'disabled' : ''}>
                        <i class="fas fa-arrow-left"></i> Previous
                    </button>
                    <div class="q-nav">
                        ${QUIZ_DATA.questions.map((_, idx) => `
                            <button class="${idx === currentQuestion ? 'current' : ''} ${answers[idx] !== undefined ? 'answered' : ''}" onclick="goToQuestion(${idx})">
                                ${idx + 1}
                            </button>
                        `).join('')}
                    </div>
                    <button class="btn btn-primary" onclick="nextQuestion()">
                        ${currentQuestion === total - 1 ? 'Submit' : 'Next'} <i class="fas fa-arrow-right"></i>
                    </button>
                </div>
            `;
        }

        function selectOption(idx) {
            answers[currentQuestion] = idx;
            renderQuiz();
        }

        function nextQuestion() {
            if (currentQuestion === QUIZ_DATA.questions.length - 1) {
                submitQuiz();
                return;
            }
            currentQuestion++;
            renderQuiz();
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                renderQuiz();
            }
        }

        function goToQuestion(idx) {
            currentQuestion = idx;
            renderQuiz();
        }

        function startQuiz() {
            quizStarted = true;
            answers = [];
            timer = 600;
            currentQuestion = 0;
            startTimer();
            renderQuiz();
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timer--;
                const display = document.getElementById('timerDisplay');
                if (display) {
                    display.textContent = '⏱️ ' + formatTime(timer);
                    if (timer < 60) display.classList.add('warning');
                }
                if (timer <= 0) {
                    clearInterval(timerInterval);
                    submitQuiz();
                }
            }, 1000);
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function submitQuiz() {
            clearInterval(timerInterval);
            let correct = 0;
            const total = QUIZ_DATA.questions.length;
            QUIZ_DATA.questions.forEach((q, idx) => {
                if (answers[idx] === q.correct) correct++;
            });
            const percentage = Math.round((correct / total) * 100);

            const app = document.getElementById('quizApp');
            app.innerHTML = `
                <div class="result-card">
                    <div style="font-size: 3rem; margin-bottom: 10px;">${percentage >= 60 ? '🎉' : '📚'}</div>
                    <div class="score">${percentage}%</div>
                    <div class="label">You got ${correct} out of ${total} correct</div>
                    <div class="details">
                        <div><div class="num green">${correct}</div><div>Correct</div></div>
                        <div><div class="num red">${total - correct}</div><div>Wrong</div></div>
                        <div><div class="num yellow">${percentage}%</div><div>Score</div></div>
                    </div>
                    <div style="margin-top: 20px; text-align: left; max-height: 300px; overflow-y: auto;">
                        ${QUIZ_DATA.questions.map((q, idx) => `
                            <div style="padding: 12px; border-bottom: 1px solid var(--glass-border);">
                                <div style="font-weight: 600; font-size: 0.9rem;">
                                    Q${idx + 1}: ${q.question.substring(0, 60)}${q.question.length > 60 ? '...' : ''}
                                    <span style="float: right; color: ${answers[idx] === q.correct ? '#22c55e' : '#ef4444'}">
                                        ${answers[idx] === q.correct ? '✅' : '❌'}
                                    </span>
                                </div>
                                <div style="font-size: 0.8rem; color: var(--gray-400);">
                                    Correct: ${q.options[q.correct]}
                                </div>
                                ${answers[idx] !== undefined && answers[idx] !== q.correct ? `
                                    <div style="font-size: 0.8rem; color: #ef4444;">
                                        Your answer: ${q.options[answers[idx]]}
                                    </div>
                                ` : ''}
                                <div style="font-size: 0.8rem; color: var(--gray-500); margin-top: 4px;">
                                    💡 ${q.explanation}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <div style="margin-top: 25px; display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">
                        <a href="quizzes.html" class="btn btn-outline"><i class="fas fa-arrow-left"></i> More Quizzes</a>
                        <a href="index.html" class="btn btn-primary"><i class="fas fa-home"></i> Home</a>
                        <button class="btn btn-outline" onclick="location.reload()"><i class="fas fa-redo"></i> Retry</button>
                    </div>
                </div>
            `;
        }

        // Initialize
        renderQuiz();
    </script>
</body>
</html>
