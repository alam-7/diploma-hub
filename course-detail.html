<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Detail - DIPLOMA HUB</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #0a0a1a;
            color: #e0e0ff;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            margin-bottom: 40px;
            border-bottom: 1px solid rgba(0, 212, 255, 0.1);
        }
        .nav-logo { font-size: 1.5rem; font-weight: 700; color: #00d4ff; }
        .nav-links { display: flex; gap: 20px; flex-wrap: wrap; }
        .nav-links a {
            color: #8888bb;
            text-decoration: none;
            font-size: 0.95rem;
            padding: 8px 12px;
            border-radius: 20px;
        }
        .nav-links a:hover { color: #00d4ff; }
        .nav-links a.active { color: #00d4ff; background: rgba(0, 212, 255, 0.1); }
        
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #00d4ff;
            text-decoration: none;
        }
        .back-link:hover { text-decoration: underline; }
        
        .course-header {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 212, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            display: flex;
            gap: 30px;
            align-items: center;
            flex-wrap: wrap;
        }
        .course-icon { font-size: 4rem; }
        .course-info h1 { font-size: 2rem; margin-bottom: 10px; }
        .course-info p { color: #8888bb; margin-bottom: 10px; }
        
        .semester-tabs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .semester-tab {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 212, 255, 0.1);
            border-radius: 30px;
            color: #8888bb;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .semester-tab:hover { border-color: #00d4ff; color: #00d4ff; }
        .semester-tab.active { background: #00d4ff; color: #0a0a1a; }
        
        .subjects-table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            overflow: hidden;
        }
        .subjects-table th {
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            text-align: left;
            color: #8888bb;
        }
        .subjects-table td {
            padding: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <div class="nav-logo">🎓 DIPLOMA HUB</div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="courses.html" class="active">Courses</a>
                <a href="equipment.html">Equipment</a>
                <a href="practicals.html">Practicals</a>
                <a href="quizzes.html">Quizzes</a>
                <a href="resources.html">Resources</a>
                <a href="about.html">About</a>
            </div>
        </nav>

        <a href="courses.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Courses</a>
        <div id="courseContent"></div>
    </div>

    <script>
        // Simple course data
        var courseData = {
            'computer-engineering': {
                name: 'Computer Engineering',
                icon: '💻',
                code: 'CO',
                description: 'Study of computers, programming, and software development.',
                semesters: {
                    1: {
                        name: 'Semester 1',
                        subjects: [
                            { code: '311302', name: 'Basic Mathematics', type: 'Theory', credits: 4, marks: 100 },
                            { code: '311303', name: 'Communication Skills', type: 'Theory', credits: 2, marks: 50 },
                            { code: '311001', name: 'Fundamentals of ICT', type: 'Practical', credits: 2, marks: 50 }
                        ]
                    },
                    2: {
                        name: 'Semester 2',
                        subjects: [
                            { code: '312303', name: 'Programming in C', type: 'Theory', credits: 4, marks: 100 },
                            { code: '312301', name: 'Applied Mathematics', type: 'Theory', credits: 4, marks: 100 }
                        ]
                    },
                    3: {
                        name: 'Semester 3',
                        subjects: [
                            { code: '313301', name: 'Data Structure Using C', type: 'Theory', credits: 4, marks: 100 },
                            { code: '313302', name: 'Database Management System', type: 'Theory', credits: 4, marks: 100 }
                        ]
                    }
                }
            },
            'mechanical-engineering': {
                name: 'Mechanical Engineering',
                icon: '⚙️',
                code: 'ME',
                description: 'Study of machines, manufacturing, and mechanical systems.',
                semesters: {
                    1: {
                        name: 'Semester 1',
                        subjects: [
                            { code: '311302', name: 'Basic Mathematics', type: 'Theory', credits: 4, marks: 100 },
                            { code: '311006', name: 'Engineering Graphics', type: 'Practical', credits: 4, marks: 100 }
                        ]
                    },
                    2: {
                        name: 'Semester 2',
                        subjects: [
                            { code: '312312', name: 'Engineering Mechanics', type: 'Theory', credits: 4, marks: 100 },
                            { code: '312340', name: 'Basic Workshop Practice', type: 'Practical', credits: 4, marks: 100 }
                        ]
                    }
                }
            },
            'civil-engineering': {
                name: 'Civil Engineering',
                icon: '🏗️',
                code: 'CE',
                description: 'Study of construction, infrastructure, and structural design.',
                semesters: {
                    1: {
                        name: 'Semester 1',
                        subjects: [
                            { code: '311302', name: 'Basic Mathematics', type: 'Theory', credits: 4, marks: 100 },
                            { code: '311010', name: 'Civil Engineering Workshop', type: 'Practical', credits: 2, marks: 50 }
                        ]
                    },
                    2: {
                        name: 'Semester 2',
                        subjects: [
                            { code: '312312', name: 'Engineering Mechanics', type: 'Theory', credits: 4, marks: 100 },
                            { code: '312339', name: 'Surveying', type: 'Practical', credits: 4, marks: 100 }
                        ]
                    }
                }
            },
            'electrical-engineering': {
                name: 'Electrical Engineering',
                icon: '⚡',
                code: 'EE',
                description: 'Study of electrical systems and power generation.',
                semesters: {
                    1: {
                        name: 'Semester 1',
                        subjects: [
                            { code: '311302', name: 'Basic Mathematics', type: 'Theory', credits: 4, marks: 100 },
                            { code: '311006', name: 'Engineering Graphics', type: 'Practical', credits: 4, marks: 100 }
                        ]
                    },
                    2: {
                        name: 'Semester 2',
                        subjects: [
                            { code: '312310', name: 'Fundamental of Electrical Engineering', type: 'Theory', credits: 4, marks: 100 },
                            { code: '312309', name: 'Elements of Electronics', type: 'Theory', credits: 4, marks: 100 }
                        ]
                    }
                }
            },
            'electronics-telecommunication': {
                name: 'Electronics & Telecommunication',
                icon: '📡',
                code: 'EJ',
                description: 'Study of electronic circuits and communication systems.',
                semesters: {
                    1: {
                        name: 'Semester 1',
                        subjects: [
                            { code: '311302', name: 'Basic Mathematics', type: 'Theory', credits: 4, marks: 100 },
                            { code: '311006', name: 'Engineering Graphics', type: 'Practical', credits: 4, marks: 100 }
                        ]
                    },
                    2: {
                        name: 'Semester 2',
                        subjects: [
                            { code: '312314', name: 'Basic Electronics', type: 'Theory', credits: 4, marks: 100 },
                            { code: '312309', name: 'Elements of Electronics', type: 'Theory', credits: 4, marks: 100 }
                        ]
                    }
                }
            }
        };

        // Get course slug from URL
        var params = new URLSearchParams(window.location.search);
        var courseSlug = params.get('course') || 'computer-engineering';
        var course = courseData[courseSlug];

        if (!course) {
            document.getElementById('courseContent').innerHTML = 
                '<p style="color:#ef4444;text-align:center;padding:40px;">Course not found!</p>';
        } else {
            // Build semester tabs
            var tabsHtml = '';
            var firstSem = 1;
            for (var s = 1; s <= 6; s++) {
                if (course.semesters[s]) {
                    if (firstSem === 1) firstSem = s;
                    tabsHtml += '<button class="semester-tab" onclick="showSemester(' + s + ')">' + course.semesters[s].name + '</button>';
                }
            }

            // Build header
            var html = `
                <div class="course-header">
                    <div class="course-icon">${course.icon}</div>
                    <div class="course-info">
                        <h1>${course.name}</h1>
                        <p><strong>Code:</strong> ${course.code}</p>
                        <p>${course.description}</p>
                    </div>
                </div>
                <div class="semester-tabs">${tabsHtml}</div>
                <div id="semesterContent"></div>
            `;
            
            document.getElementById('courseContent').innerHTML = html;
            showSemester(firstSem);
        }

        function showSemester(semester) {
            var semData = course.semesters[semester];
            var content = document.getElementById('semesterContent');
            
            if (!semData || !content) return;
            
            // Update tabs
            var tabs = document.querySelectorAll('.semester-tab');
            tabs.forEach(function(tab, index) {
                tab.classList.remove('active');
            });
            
            // Build table
            var tableHtml = `
                <h2 style="margin:20px 0;">${semData.name}</h2>
                <table class="subjects-table">
                    <thead>
                        <tr>
                            <th>Code</th>
                            <th>Subject Name</th>
                            <th>Type</th>
                            <th>Credits</th>
                            <th>Marks</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            semData.subjects.forEach(function(subject) {
                tableHtml += `
                    <tr>
                        <td>${subject.code}</td>
                        <td>${subject.name}</td>
                        <td>${subject.type}</td>
                        <td>${subject.credits}</td>
                        <td>${subject.marks}</td>
                    </tr>
                `;
            });
            
            tableHtml += '</tbody></table>';
            content.innerHTML = tableHtml;
            
            // Mark active tab
            var tabButtons = document.querySelectorAll('.semester-tab');
            tabButtons.forEach(function(tab) {
                if (tab.textContent === semData.name) {
                    tab.classList.add('active');
                }
            });
        }
    </script>
</body>
</html>
