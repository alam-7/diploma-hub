<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course Detail - DiplomaHub</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
    <div class="nav-logo">🎓 DIPLOMA HUB</div>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="courses.html" class="active">Courses</a>
        <a href="equipment.html">Equipment</a>
        <a href="practicals.html">Practicals</a>
        <a href="quizzers.html">Quizzes</a>
        <a href="resources.html">Resources</a>
        <a href="ai.html">AI</a>
    </div>
</nav>

<div class="container">
    <a href="courses.html" class="back-link">
        <i class="fas fa-arrow-left"></i> Back to Courses
    </a>

    <!-- Loading skeleton -->
    <div id="loading" class="skeleton">
        <div class="skeleton-header"></div>
        <div class="skeleton-tabs"></div>
        <div class="skeleton-table"></div>
    </div>

    <!-- Error state -->
    <div id="error" class="error-state" style="display:none;">
        <i class="fas fa-exclamation-triangle"></i>
        <h2>Data Not Available</h2>
        <p>Course data could not be loaded. Please try again later.</p>
        <button onclick="loadCourse()" class="retry-btn">
            <i class="fas fa-redo"></i> Retry
        </button>
    </div>

    <!-- Content -->
    <div id="content" style="display:none;"></div>
</div>

<!-- Load course data -->
<script src="js/msbte-k-scheme-data.js"></script>

<script>
const params = new URLSearchParams(window.location.search);
const courseSlug = params.get('course') || 'computer-engineering';

function showLoading() {
    document.getElementById('loading').style.display = 'block';
    document.getElementById('error').style.display = 'none';
    document.getElementById('content').style.display = 'none';
}

function showError(msg) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'none';
    document.getElementById('error').style.display = 'block';
    console.error('Course load error:', msg);
}

function showContent(html) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = 'none';
    document.getElementById('content').style.display = 'block';
    document.getElementById('content').innerHTML = html;
}

function loadCourse() {
    showLoading();
    try {
        // Handle both global var names
        const data = window.courseData || window.msbteData || window.coursesData;
        if (!data) throw new Error('courseData not found in msbte-k-scheme-data.js');
        
        const course = data[courseSlug];
        if (!course) throw new Error('Course not found: ' + courseSlug);

        renderCourse(course);

        // Cache for offline
        localStorage.setItem('lastCourse_' + courseSlug, JSON.stringify(course));
    } catch (err) {
        // Try cache fallback
        const cached = localStorage.getItem('lastCourse_' + courseSlug);
        if (cached) {
            console.warn('Using cached data:', err.message);
            renderCourse(JSON.parse(cached));
        } else {
            showError(err.message);
        }
    }
}

function renderCourse(course) {
    const semKeys = Object.keys(course.semesters).map(Number).sort((a,b) => a-b);
    let tabsHtml = '';
    semKeys.forEach(s => {
        tabsHtml += `<button class="semester-tab" onclick="showSemester(${s})">
            ${course.semesters[s].name}
        </button>`;
    });

    const html = `
        <div class="course-header">
            <div class="course-icon">${course.icon || '📘'}</div>
            <div class="course-info">
                <h1>${course.name}</h1>
                <p><strong>Code:</strong> ${course.code}</p>
                <p>${course.description || ''}</p>
            </div>
        </div>
        <div class="semester-tabs">${tabsHtml}</div>
        <div id="semesterContent"></div>
    `;
    showContent(html);

    window._currentCourse = course;
    showSemester(semKeys[0]);
}

function showSemester(sem) {
    const course = window._currentCourse;
    const semData = course.semesters[sem];
    if (!semData) return;

    let tableHtml = `
        <h2 class="semester-title">📘 ${semData.name}
            <small>${semData.subjects.length} subjects</small>
        </h2>
        <table class="subjects-table">
            <thead>
                <tr>
                    <th>Code</th><th>Subject Name</th>
                    <th>Type</th><th>Credits</th><th>Marks</th>
                </tr>
            </thead>
            <tbody>
    `;
    semData.subjects.forEach(s => {
        const cls = s.type === 'Theory' ? 'theory' : 'practical';
        tableHtml += `
            <tr onclick="location.href='subject.html?code=${s.code}'" style="cursor:pointer">
                <td><strong>${s.code}</strong></td>
                <td>${s.name}</td>
                <td><span class="type-tag ${cls}">${s.type}</span></td>
                <td>${s.credits}</td>
                <td>${s.marks}</td>
            </tr>
        `;
    });
    tableHtml += '</tbody></table>';

    document.getElementById('semesterContent').innerHTML = tableHtml;

    document.querySelectorAll('.semester-tab').forEach(t => {
        t.classList.toggle('active', t.textContent.trim() === semData.name);
    });
}

// Auto-load
loadCourse();
</script>

</body>
</html>
