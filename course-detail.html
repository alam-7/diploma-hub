        body {

        .nav-links a {

            padding: 6px 14px;
            border-radius: 20px;
            transition: 0.3s;
        }
        .nav-links a:hover { color: #00d4ff; background: rgba(0, 212, 255, 0.08); }
        .nav-links a.active { color: #00d4ff; background: rgba(0, 212, 255, 0.12); }
        
        .back-link {

        }

            display: flex;
            gap: 25px;
            align-items: center;

        .course-icon { font-size: 3.8rem; }
        .course-info h1 { font-size: 2rem; margin-bottom: 8px; }
        .course-info p { color: #8888bb; margin-bottom: 6px; }
        .course-info .badge {
            display: inline-block;
            background: rgba(0, 212, 255, 0.15);
            color: #00d4ff;
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 0.85rem;
            margin-top: 6px;
        }
        
        .semester-tabs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }
        .semester-tab {
            padding: 10px 22px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 212, 255, 0.1);
            border-radius: 30px;
            color: #8888bb;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }
        .semester-tab:hover { border-color: #00d4ff; color: #00d4ff; transform: translateY(-2px); }
        .semester-tab.active { background: #00d4ff; color: #0a0a1a; font-weight: 600; }
        
        .subjects-table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            overflow: hidden;
            margin-top: 10px;
        }
        .subjects-table th {
            background: rgba(0, 0, 0, 0.35);
            padding: 14px 16px;
            text-align: left;
            color: #8888bb;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .subjects-table td {
            padding: 13px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.95rem;
        }
        .subjects-table tr:hover td { background: rgba(0, 212, 255, 0.04); }
        .subjects-table .type-tag {
            display: inline-block;
            padding: 2px 14px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .type-tag.theory { background: rgba(0, 212, 255, 0.15); color: #00d4ff; }
        .type-tag.practical { background: rgba(255, 200, 0, 0.15); color: #ffcc00; }
        
        .semester-title {
            margin: 15px 0 10px 0;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .semester-title small {
            font-size: 0.85rem;
            color: #8888bb;
            font-weight: 400;
        }
        
        .footer-note {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            color: #555577;
            font-size: 0.85rem;
        }

        @media (max-width: 600px) {
            .course-header { flex-direction: column; text-align: center; }
            .course-icon { font-size: 3rem; }
            .course-info h1 { font-size: 1.5rem; }
            .subjects-table { font-size: 0.8rem; }
            .subjects-table th, .subjects-table td { padding: 8px 10px; }
            .semester-tab { padding: 8px 14px; font-size: 0.8rem; }

        var params = new URLSearchParams(window.location.search);
        var courseSlug = params.get('course') || 'computer-engineering';
        var course = courseData[courseSlug];

        if (!course) {
            document.getElementById('courseContent').innerHTML = 
                '<p style="color:#ef4444;text-align:center;padding:40px;font-size:1.2rem;">❌ Course not found!</p>';
        } else {
            // Build semester tabs
            var tabsHtml = '';
            var firstSem = 1;
            var semKeys = Object.keys(course.semesters).map(Number).sort((a,b) => a-b);
            
            semKeys.forEach(function(s) {
                if (firstSem === 1) firstSem = s;
                tabsHtml += '<button class="semester-tab" onclick="showSemester(' + s + ')">' + 
                            course.semesters[s].name + '</button>';
            });

            // Build header
            var html = `
                <div class="course-header">
                    <div class="course-icon">${course.icon}</div>
                    <div class="course-info">
                        <h1>${course.name}</h1>
                        <p><strong>Code:</strong> ${course.code}</p>
                        <p>${course.description}</p>
                        <span class="badge"><i class="fas fa-check-circle"></i> ${semKeys.length} Semesters · K-Scheme</span>
                    </div>
                </div>
                <div class="semester-tabs">${tabsHtml}</div>
                <div id="semesterContent"></div>
            `;
            
            document.getElementById('courseContent').innerHTML = html;
            showSemester(firstSem);
        }

        // ============================================================
        // SHOW SEMESTER FUNCTION
        // ============================================================

        function showSemester(semester) {
            var semData = course.semesters[semester];
            var content = document.getElementById('semesterContent');
            
            if (!semData || !content) return;

            // Build table
            var tableHtml = `
                <div class="semester-title">
                    📘 ${semData.name}
                    <small>${semData.subjects.length} subjects</small>
                </div>
                <table class="subjects-table">
                    <thead>
                        <tr>
                            <th>Code</th>
                            <th>Subject Name</th>
                            <th>Type</th>
                            <th>Credits</th>
                            <th>Marks</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            semData.subjects.forEach(function(subject) {
                var typeClass = (subject.type === 'Theory') ? 'theory' : 'practical';
                tableHtml += `
                    <tr>
                        <td><strong>${subject.code}</strong></td>
                        <td>${subject.name}</td>
                        <td><span class="type-tag ${typeClass}">${subject.type}</span></td>
                        <td>${subject.credits}</td>
                        <td>${subject.marks}</td>
                    </tr>
                `;
            });
            
            tableHtml += '</tbody></table>';
            content.innerHTML = tableHtml;

            // Mark active tab
            var tabButtons = document.querySelectorAll('.semester-tab');
            tabButtons.forEach(function(tab) {
                tab.classList.remove('active');
                if (tab.textContent === semData.name) {
                    tab.classList.add('active');
                }
            });
        }
